.sl-net{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent);font-size:15px}
.sl-net b{font-size:22px;font-weight:400}
.letter .lt-date{margin:22px 0;color:var(--muted);font-size:13px}.letter .lt-body{line-height:1.9;font-size:14.5px}.letter .lt-sign{margin-top:40px}.letter .lt-sign span{display:block;color:var(--muted);font-size:13px}
.tier{gap:8px;margin-bottom:8px;flex-wrap:wrap}
/* client tab + portal */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.portal{width:100%;min-width:0;max-width:980px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:1}
.pt-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.pt-head b{display:block;font-weight:600}.pt-head span{font-size:12.5px;color:var(--muted)}
.pt-foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:30px}
.pt-pin{max-width:400px;margin:10vh auto;padding:30px;text-align:center}.pt-pin .inp{width:100%}.pt-pin h2{font-weight:300;margin:0 0 4px}
.pt-hero{display:flex;gap:20px;align-items:center;padding:24px}.pt-hero h1{margin:6px 0 4px;font-size:32px;font-weight:300;letter-spacing:-.02em}
.pt-tl{padding:8px 18px}
.pt-st{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.pt-st:last-child{border-bottom:0}.pt-st b{display:block;font-weight:500}.pt-st span{font-size:12px;color:var(--muted)}
.pt-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted);flex:none}
.pt-n svg.i{width:13px;height:13px;stroke-width:3}
.pt-st.done .pt-n{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pt-st.active .pt-n{background:var(--ink);color:var(--bg)}.pt-st.pending{opacity:.6}
.pt-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pt-it{padding:14px 16px;display:flex;flex-direction:column;gap:10px}.pt-it b{font-weight:500}
.story-cta{display:flex;align-items:center;gap:12px;padding:16px 18px}.story-cta b{flex:1;font-weight:500}.story-cta span{color:var(--muted);font-size:13px}
/* stories */
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.story-card{overflow:hidden;padding:0;display:flex;flex-direction:column;text-align:start;transition:transform .2s,border-color .2s}
.story-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.story-card.ghost{border-style:dashed;opacity:.8}
.sc-cover{height:170px;background:center/cover no-repeat linear-gradient(140deg,var(--accent-soft),rgba(216,184,120,.15));display:grid;place-items:center;color:var(--muted)}
.sc-cover svg.i{width:38px;height:38px;opacity:.6}
.sc-b{padding:14px 16px;display:flex;flex-direction:column;gap:4px}.sc-b h3{margin:2px 0;font-weight:400;font-size:18px}
.story{max-width:1000px;margin:0 auto}
.st-hero{position:relative;height:min(56vh,460px);border-radius:26px;overflow:hidden;background:center/cover no-repeat linear-gradient(140deg,#1e2a24,#0c100e);display:flex;align-items:flex-end;margin-bottom:16px;border:1px solid var(--line)}
.st-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.78))}
.st-ht{position:relative;padding:30px;color:#fff}.st-ht .eyebrow{color:rgba(255,255,255,.7)}
.st-ht h1{font-size:44px;font-weight:200;letter-spacing:-.02em;line-height:1.1;margin:8px 0}.st-p{color:rgba(255,255,255,.8)}
.st-act{position:absolute;top:16px;inset-inline-end:16px;display:flex;gap:8px}
.st-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:22px}
.st-stats div{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:center}
.st-stats b{display:block;font-size:28px;font-weight:200}.st-stats span{font-size:12px;color:var(--muted)}
.st-media{padding:0;overflow:hidden;margin-bottom:16px}.vid{width:100%;aspect-ratio:16/9;display:block;border:0;background:#000}.vid iframe{width:100%;height:100%;border:0}
.st-body{display:flex;flex-direction:column;gap:6px;margin:10px 0 20px}
.st-sec{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line2)}
.st-num{font-size:30px;font-weight:200;color:var(--accent)}
.st-sec h2{margin:2px 0 6px;font-weight:400;font-size:21px}.st-sec p{margin:0;color:var(--ink2);line-height:1.85;font-size:15px}
.st-q{margin:24px 0;padding:24px 28px;border-inline-start:3px solid var(--accent);font-size:22px;font-weight:300;line-height:1.5;background:var(--surface);border-radius:0 18px 18px 0}
[dir="rtl"] .st-q{border-radius:18px 0 0 18px}
.st-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.st-img{aspect-ratio:4/3;border-radius:16px;background:center/cover no-repeat var(--surface2);border:1px solid var(--line)}
.st-tl{padding:16px 20px;margin-bottom:16px}.st-tl h2,.ll h2{font-weight:400;font-size:18px;margin:0 0 10px}
.st-tl .pt-n{color:#111}
.ll ul{margin:0;padding-inline-start:20px;line-height:1.9;color:var(--ink2)}
.ll.good{border-color:rgba(56,224,123,.3)}.ll.imp{border-color:rgba(244,182,74,.35)}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}.nudge{inset-inline-start:16px}}
@media (max-width:760px){
 .nudge{bottom:calc(150px + var(--safe-b));inset-inline-start:12px}
 .sl-grid{grid-template-columns:1fr}
 .pt-hero{flex-direction:column;align-items:flex-start}.pt-hero h1{font-size:26px}
 .st-ht h1{font-size:30px}.st-sec{grid-template-columns:44px 1fr}.st-num{font-size:22px}
 .gb h1{font-size:30px}.gb-e{font-size:58px}
 .kb{grid-template-columns:96px 1fr 26px}
 .lh-c{display:none}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.up-opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--surface)}
.up-opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.up-opt input{margin-top:3px;accent-color:var(--accent)}.up-opt b{display:block;font-weight:500}.up-opt em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
.setup-link{display:block;text-align:center;margin-top:14px}

/* ===== v6 admin console ===== */
.adm-promo{display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(120deg,var(--gold-soft),var(--accent-soft));text-decoration:none;color:var(--ink)}.adm-promo b{display:block;font-weight:500}.adm-promo span span{display:block;font-size:12.5px;color:var(--muted)}

.adm{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:100%;gap:22px;align-items:start}
.adm-nav{position:sticky;top:calc(var(--top) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.adm-hd{display:flex;gap:12px;align-items:center;padding:6px 6px 14px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.adm-hd b{display:block;font-weight:600;font-size:14.5px}.adm-hd span:not(.adm-ic){display:block;font-size:12px;color:var(--muted)}
.adm-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold-soft),var(--accent-soft));color:var(--gold);border:1px solid var(--line)}
.adm-tabs{display:flex;flex-direction:column;gap:2px}
.adm-tabs button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:var(--ink2);font-weight:500;font-size:13.5px;text-align:start}
.adm-tabs button:hover{background:var(--surface2)}
.adm-tabs button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.adm-tabs .cnt.hot{background:var(--late);color:#fff;border-color:transparent}
.adm-main{min-width:0}
.adm-h{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:2px 0 18px}
.adm-h h2{font-weight:300;font-size:26px;margin:0;letter-spacing:-.01em}.adm-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:640px}
.adm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.adm-tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:12px;padding:16px;text-align:start;cursor:pointer;transition:transform .15s,border-color .15s}
.adm-tile:hover{transform:translateY(-2px);border-color:var(--muted)}
.adm-tile .ic{grid-row:1/4;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.adm-tile b{font-size:24px;font-weight:300;line-height:1.1}.adm-tile span{font-size:12.5px;color:var(--ink2)}.adm-tile em{font-style:normal;font-size:11.5px;color:var(--muted)}
.adm-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.adm-check{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line2)}
.adm-check:last-child{border-bottom:0}.adm-check b{display:block;font-weight:500;font-size:13.5px}.adm-check span:not(.st){display:block;font-size:12px;color:var(--muted)}
.adm-check .st{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.adm-check .st.ok{background:var(--ok-soft);color:var(--ok)}.adm-check .st.warn{background:var(--risk-soft);color:var(--risk)}
.adm-check .st .i,.adm-tile .ic .i{width:16px;height:16px}
.adm-log{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line2);font-size:13px}
.adm-log b{font-weight:500}.adm-log:last-child{border-bottom:0}
.adm-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search-in{position:relative;min-width:200px}.search-in .i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-in .inp{padding-inline-start:36px;width:100%}
.adm-bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:10px;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);animation:pop .15s ease}
.adm-tbl td{vertical-align:middle}.adm-tbl td,.adm-tbl th{padding:10px 12px}.rsel{display:flex;align-items:center;white-space:nowrap}.search-in .i{z-index:1;pointer-events:none}.adm-tabs .cnt{min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}.adm-tbl tr.off td{opacity:.5}.adm-tbl tr.off td:last-child,.adm-tbl tr.off td:nth-last-child(2){opacity:1}
.adm-who{display:flex;gap:10px;align-items:center;text-align:start;min-width:0}
.adm-who b{display:block;font-weight:500;font-size:13.5px}.adm-who em{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.rdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent)}
.rdot.lg{width:12px;height:12px}
.sel.sm,.inp.sm{height:32px;font-size:12.5px;padding-block:0}
.tg{position:relative;display:inline-block;width:40px;height:23px;flex:none;cursor:pointer}
.tg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tg span{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--line);transition:.2s}
.tg span::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:.2s}
.tg input:checked+span{background:var(--accent);border-color:var(--accent)}
.tg input:checked+span::after{background:var(--accent-ink);inset-inline-start:19px}
.tg.dis{opacity:.45;cursor:not-allowed}
.modal.ud{max-width:760px}.ud-tabs{margin:0;padding:0 18px;flex:none;min-height:44px}.ud-b{min-height:320px}
.role-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.role-pick button{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px}
.role-pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.role-pick button:disabled{opacity:.55;cursor:not-allowed}
.ud-grp{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ud-gh{padding:8px 14px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line2)}
.ud-p{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}.ud-p:last-child{border-bottom:0}
.ud-p b{display:block;font-weight:500;font-size:13px}.ud-p span:not(.eff){display:block;font-size:11.5px;color:var(--muted)}
.eff{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--late-soft);color:var(--late);flex:none}.eff.on{background:var(--ok-soft);color:var(--ok)}.eff .i{width:14px;height:14px}
.seg.tri button{height:28px;padding:0 10px;font-size:12px}
.seg.tri button.v-allow.on{background:var(--ok-soft);color:var(--ok)}.seg.tri button.v-deny.on{background:var(--late-soft);color:var(--late)}
.role-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.role-card{padding:16px}.role-card b{font-weight:500}
.role-card.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-style:dashed;color:var(--ink2);min-height:130px;cursor:pointer}
.av-stack{display:inline-flex}.av-stack .av{margin-inline-end:-7px;box-shadow:0 0 0 2px var(--solid)}
.matrix{max-height:calc(100vh - 230px);overflow:auto}
.mx th{position:sticky;top:0;z-index:2;background:var(--solid);text-align:center;font-weight:500;font-size:12.5px;white-space:nowrap}
.mx th em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
.mx .mx-p{text-align:start;min-width:250px;position:sticky;inset-inline-start:0;background:var(--solid);z-index:1}
.mx th.mx-p{z-index:3}
.mx td.mx-p b{display:block;font-weight:500;font-size:13px}.mx td.mx-p span{display:block;font-size:11.5px;color:var(--muted)}
.mx tr.mx-g td{background:var(--surface2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 14px;position:sticky;inset-inline-start:0}
.mx-c{text-align:center}
.mx-cb{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;transition:.15s;margin:0}
.mx-cb:hover{border-color:var(--muted)}
.mx-cb:checked{background:var(--accent);border-color:var(--accent)}
.mx-cb:checked::after{content:'';width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.mx-lock{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}.mx-lock .i{width:13px;height:13px}
.mx tbody tr:not(.mx-g):hover td{background:var(--surface)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches input{display:none}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px var(--solid),0 0 0 3px transparent;transition:.15s}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--ink)}
.day-pick{display:flex;gap:6px;flex-wrap:wrap}
.day-pick button{height:34px;min-width:52px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:12.5px;color:var(--ink2)}
.day-pick button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.adm-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.adm-link{display:grid;grid-template-columns:auto 1fr;column-gap:12px;text-align:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:.15s}
.adm-link:hover{border-color:var(--muted);transform:translateY(-1px)}
.adm-link .i{grid-row:1/3;width:20px;height:20px;color:var(--accent);margin-top:2px}.adm-link b{font-weight:500;font-size:13.5px}.adm-link span{font-size:12px;color:var(--muted)}
.chip-tg{display:flex;flex-wrap:wrap;gap:8px}
.chip-tg label{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted);text-decoration:line-through;transition:.15s}
.chip-tg label.on{color:var(--ink);text-decoration:none;border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.chip-tg .i{width:15px;height:15px}
.cat-st{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.cat-st summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;list-style:none;background:var(--surface)}
.cat-st summary::-webkit-details-marker{display:none}.cat-st b{font-weight:500}
.cat-st[open] summary{border-bottom:1px solid var(--line2)}.cat-st>.tbl-wrap,.cat-st>.btn{margin:10px 14px}
.cat-tbl td{padding:6px 8px}.cat-tbl tr.off td{opacity:.5}.cat-tbl .inp{min-width:150px}
.adm-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.adm-counts div{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.adm-counts b{display:block;font-size:20px;font-weight:300}.adm-counts span{font-size:12px;color:var(--muted)}
.accent-pick{display:flex;flex-wrap:wrap;gap:10px}
.accent-pick button,.accent-pick .custom{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:86px;cursor:pointer}
.accent-pick button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.accent-pick span{width:34px;height:34px;border-radius:50%;display:block}
.accent-pick span.follow{background:conic-gradient(#38E07B,#3FD6C6,#E2C27E,#B9A6FF,#38E07B)}
.accent-pick em{font-style:normal;font-size:11.5px;color:var(--ink2)}
.accent-pick input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.brand-mark img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.brand-mark:has(img){background:var(--solid);padding:3px;overflow:hidden}
.pv-bar{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
@media (max-width:1100px){.adm{grid-template-columns:210px minmax(0,1fr)}.adm-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.adm-2{grid-template-columns:1fr}}
@media (max-width:760px){
 .adm{grid-template-columns:minmax(0,1fr);gap:12px}.adm-nav,.adm-main{min-width:0}.adm-h .seg{max-width:100%;overflow-x:auto}
 .adm-nav{position:static;padding:8px;border-radius:16px}.adm-hd{display:none}
 .adm-tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}.adm-tabs::-webkit-scrollbar{display:none}
 .adm-tabs button{white-space:nowrap;flex:none;padding:8px 12px}
 .adm-h{flex-direction:column;align-items:stretch}.adm-h>.btn,.adm-h>.seg{align-self:flex-start}.adm-h h2{font-size:22px}.adm-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.adm-tile{padding:12px}.adm-tile .ic{width:34px;height:34px}
 .adm-links,.adm-counts{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ud-p{flex-wrap:wrap}.ud-p .grow{flex-basis:calc(100% - 40px)}.seg.tri{margin-inline-start:auto}
 .mx .mx-p{min-width:170px}.adm-who em{max-width:140px}
}

[dir="rtl"] .side .brand-s,[dir="rtl"] .login .brand-s{-webkit-mask-position:right center;mask-position:right center}
.bi,.bw{display:block;width:100%;height:auto}
/* 3 · sign-in: a branded moment */
.login-wrap{background:radial-gradient(760px 480px at 50% 0%,rgba(158,74,77,.20),transparent 70%),radial-gradient(600px 380px at 50% 110%,rgba(217,156,87,.10),transparent 70%)}
.login{position:relative;overflow:hidden}
.login::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--b-burgundy),var(--b-ruby),var(--b-copper),var(--b-sand))}
.login::after{content:"+";position:absolute;top:12px;inset-inline-end:16px;font-size:18px;font-weight:300;color:var(--b-copper);line-height:1}
.login-tag{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line2);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.login-tag span{color:var(--b-copper);font-size:14px;letter-spacing:0}
/* 4 · client-facing pages speak the brand (portal + joining page) */
.portal,.join{--accent:#D99C57;--accent2:#A9733A;--accent-ink:#1E0F08;--accent-soft:rgba(217,156,87,.13);--glow:0 0 0 1px rgba(217,156,87,.55),0 0 26px rgba(217,156,87,.28)}
[data-theme="light"] .portal,[data-theme="light"] .join{--accent:#754540;--accent2:#47211C;--accent-ink:#F4EEE2;--accent-soft:rgba(117,69,64,.10);--glow:0 0 0 1px rgba(117,69,64,.45),0 0 22px rgba(117,69,64,.15)}
.portal .btn.acc,.join .btn.acc{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent) 55%,var(--accent2));color:var(--accent-ink);box-shadow:0 0 20px rgba(158,74,77,.18)}
.pt-word{width:170px;color:var(--ink);margin:2px 0 4px}
.pt-head{padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
.pt-head::after{content:"";position:absolute;inset-inline-start:0;bottom:-1px;width:120px;height:2px;background:linear-gradient(90deg,var(--b-ruby),var(--b-copper))}
.pt-foot::before{content:"+  Enhancing Design Excellence  +";display:block;letter-spacing:.22em;text-transform:uppercase;font-size:10px;color:var(--b-copper);margin-bottom:8px}
/* 5 · admin console: brand indexing */
.adm-tabs{counter-reset:adm}
.adm-tabs button::after{counter-increment:adm;content:"0." counter(adm);margin-inline-start:auto;font-size:10.5px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.adm-ic{background:linear-gradient(150deg,var(--b-bliss),var(--b-burgundy))!important;color:var(--b-ivory)!important;border:0!important}
.slow-hint{opacity:0;animation:slowHint .4s ease 9s forwards;margin-top:14px}@keyframes slowHint{to{opacity:1}}
.join-err{display:flex;gap:12px;align-items:flex-start;margin:14px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--late) 45%,transparent);background:color-mix(in srgb,var(--late) 10%,transparent);color:var(--ink)}.join-err svg{color:var(--late);flex:none;margin-top:2px}

function planStages(category,start,due){
 const tpl=STAGE_TPL[category]||STAGE_TPL.design, tot=sum(tpl,s=>s.w), span=Math.max(diff(start,due),tpl.length);
 let acc=0;return tpl.map(s=>{const st=addDays(start,Math.round(acc/tot*span));acc+=s.w;const en=addDays(start,Math.round(acc/tot*span));
  return {k:s.k,status:'pending',start:st,end:en,startedAt:null,doneAt:null,pay:{pct:s.pay,received:false,receivedAt:null}}});
}
function replan(p){ // keep statuses, recompute planned dates
 const fresh=planStages(p.category,p.start,p.due);
 p.stages=fresh.map((f,i)=>{const o=p.stages&&p.stages.find(s=>s.k===f.k);return o?Object.assign({},o,{start:f.start,end:f.end}):f});
}
const activeIdx=p=>p.stages.findIndex(s=>s.status==='active');
const curStage=p=>p.stages[activeIdx(p)]||null;
const isDone=p=>p.stages.every(s=>s.status==='done');
const pTasks=(p,k)=>S.tasks.filter(x=>x.projectId===p.id&&(!k||x.stage===k));
function progress(p){
 const tpl=tplOf(p);let tot=0,acc=0;
 p.stages.forEach(s=>{const w=(tpl.find(x=>x.k===s.k)||{w:1}).w;tot+=w;
  if(s.status==='done')acc+=w;
  else if(s.status==='active'){const ts=pTasks(p,s.k);const r=ts.length?sum(ts,x=>x.status==='done'?1:x.status==='review'?.75:x.status==='doing'?.4:0)/ts.length:.15;acc+=w*r*.95}});
 return tot?Math.round(acc/tot*100):0;
}
function expected(p){const T=TODAY();const span=diff(p.start,p.due);if(span<=0)return 100;return clamp(Math.round(diff(p.start,T)/span*100),0,100)}
function health(p){
 if(isDone(p))return 'done'; if(p.hold)return 'hold';
 const T=TODAY(); if(p.due&&diff(p.due,T)>0)return 'late';
 const pr=progress(p),ex=expected(p),cs=curStage(p);
 if(pr<ex-15)return 'risk';
 if(cs&&cs.end&&diff(cs.end,T)>3)return 'risk';
 const od=pTasks(p).filter(x=>x.status!=='done'&&x.due&&diff(x.due,T)>2).length; if(od>=2)return 'risk';
 return 'ok';
}
const isActive=p=>!isDone(p)&&!p.hold&&!p.archived;
const taskOverdue=x=>x.status!=='done'&&x.due&&diff(x.due,TODAY())>0;
const lvl=p=>p>110?'over':p>85?'hi':p<40?'lo':'ok';

}

 S.projects.filter(p=>!p.archived&&!isDone(p)).forEach(p=>{
  const nm=p.name;
  const cs=curStage(p), sd=cs?stageDef(p,cs.k):null, h=health(p);
  if(p.hold)return;

 });
 S.team.filter(m=>m.active!==false&&m.access!=='viewer').forEach(m=>{

 });

function startSphere(cv,mix){
 if(SPH)SPH.stop();

  const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*g,j=1+(Math.random()-.5)*.1,inner=Math.random()<.07?(.3+Math.random()*.6):1,rr=j*inner;

function viewTimeline(){
 let list=S.projects.filter(p=>!p.archived&&(!ui.ganttActive||!isDone(p)));
 list.sort((a,b)=>a.start<b.start?-1:1);
 const tool=`<div class="toolbar"><div class="seg"><button class="${prefs.zoom==='week'?'on':''}" data-act="zoom" data-v="week">${t('zoomWeek')}</button><button class="${prefs.zoom==='month'?'on':''}" data-act="zoom" data-v="month">${t('zoomMonth')}</button></div>
  <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" data-act="gactive" ${ui.ganttActive?'checked':''}>${t('activeOnly')}</label><span class="grow"></span>
  <div class="legend hide-m">${STAGE_TPL.design.map(s=>`<span><i style="background:${s.c}"></i>${esc(L(s))}</span>`).join('')}</div></div>`;
 if(!list.length)return tool+`<div class="card empty">${t('noProjects')}</div>`;
 const T=TODAY();
 let a=list.reduce((m,p)=>p.start<m?p.start:m,T),b=list.reduce((m,p)=>p.due>m?p.due:m,T);
 a=addDays(a,-7);b=addDays(b,21);
 const d0=parse(a);d0.setDate(1);a=iso(d0);
 const px=prefs.zoom==='week'?20:6,days=diff(a,b),W=days*px,lab=innerWidth<=760?140:240;
 const x=d=>diff(a,d)*px;
 let months='',weeks='',grid='';
 for(let d=parse(a);d<=parse(b);d.setMonth(d.getMonth()+1)){const s=iso(d),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();months+=`<div class="g-m" style="left:${x(s)}px;width:${n*px}px">${new Intl.DateTimeFormat(locale(),{month:'long',year:'numeric'}).format(d)}</div>`;grid+=`<div class="g-grid" style="left:${x(s)+lab}px;background:var(--line)"></div>`}
 if(prefs.zoom==='week'){const d=parse(a);while(d.getDay()!==6)d.setDate(d.getDate()+1);for(;d<=parse(b);d.setDate(d.getDate()+7)){const s=iso(d);weeks+=`<div class="g-w num" style="left:${x(s)}px;width:${7*px}px">${d.getDate()}</div>`;grid+=`<div class="g-grid" style="left:${x(s)+lab}px"></div>`}}
 const rows=list.map(p=>{const h=health(p);return `<div class="g-row"><div class="g-lab" style="width:${lab}px" data-go="p-${p.id}" dir="${prefs.lang==='ar'?'rtl':'ltr'}"><b>${esc(p.name)}</b><span>${hChip(h).replace('chip','chip" style="height:18px;font-size:10.5px;padding:0 6px')}</span></div><div class="g-track" style="width:${W}px">${p.stages.map(s=>{const d=stageDef(p,s.k);const st=s.status==='done'&&s.startedAt?s.startedAt.slice(0,10):s.start;const en=s.status==='done'&&s.doneAt?s.doneAt.slice(0,10):s.end;const w=Math.max(px,(diff(st,en)||1)*px);return `<div class="g-seg ${s.status==='pending'?'pend':s.status==='active'?'act':''}" style="left:${x(st)}px;width:${w}px;background:${d.c}" title="${esc(L(d))} · ${fmtD(st)} → ${fmtD(en)}" data-go="p-${p.id}">${w>60?esc(L(d)):''}</div>`}).join('')}<div class="g-due" style="left:${x(p.due)}px" title="${t('dueMark')} ${fmtD(p.due)}"></div></div></div>`}).join('');
 return tool+`<div class="card gantt" id="gantt"><div class="g-in" style="width:${W+lab}px">${grid}<div class="g-today" style="left:${x(T)+lab}px"></div>
  <div class="g-head"><div class="g-corner" style="width:${lab}px"></div><div class="g-scale" style="width:${W}px">${months}${weeks}</div></div>${rows}</div></div>`;
}

/* ---------------- stage-gate actions ---------------- */
function setStage(p,idx,silent){
 const n=nowIso();
 p.stages.forEach((s,i)=>{
  if(i<idx){if(s.status!=='done'){s.status='done';s.doneAt=s.doneAt||n;s.startedAt=s.startedAt||n}}
  else if(i===idx){if(s.status!=='active'){s.status='active';s.startedAt=n;s.doneAt=null}}
  else{s.status='pending';s.startedAt=null;s.doneAt=null}
 });
 p.updatedAt=n;if(!silent)addLog(p.id,'log_stage',{s:stageDef(p,p.stages[idx].k)},'flag');
}
function advance(p){
 const i=activeIdx(p);if(i<0)return;const s=p.stages[i];
 const open=pTasks(p,s.k).filter(x=>x.status!=='done').length;
 const doIt=()=>{
  if(s.k==='approval')addLog(p.id,'log_approved',{s:stageDef(p,'3d')},'check');
  (p.revisions||[]).forEach(r=>{if(r.status==='open'&&s.k==='approval')r.status='resolved'});
  if(i===p.stages.length-1){s.status='done';s.doneAt=nowIso();addLog(p.id,'log_done',{},'check')}
  else setStage(p,i+1);
  Store.put('projects',p);toast(t('saved'));render();
  
 };
 if(open)confirmBox(t('openTasksWarn',{n:open}),doIt,false);else doIt();
}
function reopen(p){const i=activeIdx(p);const tgt=i<0?p.stages.length-1:i-1;if(tgt<0)return;setStage(p,tgt);Store.put('projects',p);render()}

function setTaskStatus(x,s){const was=x.status;x.status=s;x.updatedAt=nowIso();if(s==='done'&&was!=='done'){x.doneAt=nowIso();addLog(x.projectId,'log_taskdone',{t:x.title},'check')}if(s!=='done')x.doneAt=null;Store.put('tasks',x);const p=proj(x.projectId);if(p)Store.put('projects',p);render()}

document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');
 if(a&&a.tagName!=='SELECT'&&!(a.tagName==='INPUT'&&a.type!=='checkbox')){if(a.type==='checkbox'&&a.dataset.act!=='gactive')return;const f=ACT[a.dataset.act];if(f){if(a.tagName!=='INPUT')e.preventDefault();f(a.dataset,a,e);return}}
 const hb=e.target.closest('[data-hub]');if(hb){selectHub(hb.dataset.hub);return}
 const ob=e.target.closest('[data-orb]');if(ob){if(ob.dataset.orb===ui.orbSel&&e.detail>1){go('p-'+ob.dataset.orb);return}selectOrb(ob.dataset.orb);return}
 const al=e.target.closest('[data-alert]');
 if(al){const o=JSON.parse(al.dataset.alert);if(o.tab)ui.tab=o.tab;else ui.tab='tasks';if(o.eng){ui.taskF={eng:o.eng,proj:'',due:o.eng==='_none'?'':'overdue',status:''}}if(o.member){go('m-'+o.member);return}go(o.go);return}
 const tk=e.target.closest('[data-task]');if(tk&&!e.target.closest('.chk')){closeModal();taskForm(S.tasks.find(x=>x.id===tk.dataset.task));return}
 const mb=e.target.closest('[data-member]');if(mb){closeModal();go('m-'+mb.dataset.member);return}
 const g=e.target.closest('[data-go]');
 if(g){const v=g.dataset.go;closeModal();
  if(v.startsWith('task:')){taskForm(S.tasks.find(x=>x.id===v.slice(5)));return}
  if(v.startsWith('projects:')){const h=v.split(':')[1];ui.projF.health=h;go('projects');return}
  if(v==='tasks:overdue'){ui.taskF={eng:'',proj:'',due:'overdue',status:''};go('tasks');return}
  if(v.startsWith('p-'))ui.tab='tasks';
  if(v==='projects')ui.projF.health='all';
  go(v)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.pf){ui.projF[el.dataset.pf]=el.value;render();return}
 if(el.dataset.tf){ui.taskF[el.dataset.tf]=el.value;render();return}
 if(el.dataset.act==='setMe'){prefs.me=el.value;savePrefs();render();return}
 if(el.id==='impf'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.team||!d.projects)throw new Error('format');S=Object.assign({team:[],projects:[],tasks:[],logs:[],meta:{}},d);S.meta.demo=false;Store.saveAll();toast(t('imported'));render()}catch(err){toast(t('badCfg'))}};r.readAsText(el.files[0])}
});
let qT=null;
document.addEventListener('input',e=>{if(e.target.id==='pq'){ui.projF.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=e.target.selectionStart;render();const n=$('#pq');if(n){n.focus();n.setSelectionRange(pos,pos)}},180)}});
document.addEventListener('submit',async e=>{if(e.target.id==='askF'){e.preventDefault();openSearch($('#askQ').value);return}if(e.target.id==='loginF'){e.preventDefault();const f=e.target;try{await Store.signIn(f.email.value.trim(),f.pw.value)}catch(err){$('#loginErr').textContent=err.message}}else e.preventDefault()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return}
 const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 if(!typing&&(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))){e.preventDefault();openSearch()}
 if(!typing&&!$('#ov')&&$('#deck')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();setDeck(ui.deckIdx+(e.key==='ArrowRight'?1:-1));return}
 if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const b=$('#ov .m-f .btn.pri');if(b)b.click()}
});
window.addEventListener('hashchange',()=>{closeModal();render();scrollTo(0,0)});
let rzT=null,lastW=innerWidth;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(innerWidth===lastW)return;lastW=innerWidth;const r=route();if(r.v==='home')layoutOrbit();else if(r.v==='timeline'||r.v==='projects')render()},200)});

/* ---------------- drag & drop ---------------- */
function afterRenderBase(r){
 if(r.v==='home'){const cv=$('#sphere');if(cv){const ac=S.projects.filter(isActive),n=Math.max(1,ac.length);startSphere(cv,{late:ac.filter(p=>health(p)==='late').length/n*.5,risk:ac.filter(p=>health(p)==='risk').length/n*.5})}
  requestAnimationFrame(layoutOrbit);setTimeout(layoutOrbit,350);
  const st=$('#orbStage');if(st)st.addEventListener('pointermove',e=>{const b=st.getBoundingClientRect();SPH&&SPH.point((e.clientX-b.left)/b.width-.5,(e.clientY-b.top)/b.height-.5)})}
 else if(SPH){SPH.stop();SPH=null}
 if($('#deck'))initDeck();
 $$('.kc[draggable="true"]').forEach(c=>{
  c.addEventListener('dragstart',e=>{c.classList.add('dragging');e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'});
  c.addEventListener('dragend',()=>c.classList.remove('dragging'))});
 $$('[data-drop],[data-drop-stage]').forEach(col=>{
  col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
  col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});
  col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');
   if(col.dataset.drop){const x=S.tasks.find(y=>y.id===id);if(x&&x.status!==col.dataset.drop&&can('task',x)){setTaskStatus(x,col.dataset.drop);toast(t('moved'))}}
   else{const p=proj(id);if(!p||!can('stage',p))return;const idx=p.stages.findIndex(s=>s.k===col.dataset.dropStage);if(idx>=0&&idx!==activeIdx(p)){setStage(p,idx);Store.put('projects',p);toast(t('moved'));render()}}})});
 if(r.v==='project'){const st=$('#stepper [data-active]'),sc=$('#stepper');if(st&&sc){const d=(st.getBoundingClientRect().left+st.offsetWidth/2)-(sc.getBoundingClientRect().left+sc.clientWidth/2);sc.scrollLeft+=d}}
 if(r.v==='timeline'){const g=$('#gantt'),td=$('.g-today');if(g&&td&&!g.dataset.sc){g.scrollLeft=Math.max(0,td.offsetLeft-g.clientWidth*.35)}}
}

/* ---------- hashing ---------- */
function cyrb(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')}
async function hashPw(user,pw){const s=`pdt:${String(user).toLowerCase()}:${pw}`;try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return 'c:'+cyrb(s)+cyrb(s+'#')}

/* ---------- files (IndexedDB locally, chunked Firestore docs when connected) ---------- */
const FileStore={
 db:null,mem:{},
 idb(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('pdt_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 async put(file,dataUrl){
  const id='f'+uid(),rec={id,name:file.name,type:file.type||'',size:file.size||dataUrl.length*.75,at:nowIso()};
  if(Store.mode==='fb'&&Store.fb){const CH=900000,n=Math.ceil(dataUrl.length/CH);for(let i=0;i<n;i++)await Store.fb.db.collection(Store.coll('files')).doc(id+'_'+i).set({fid:id,i,n,data:dataUrl.slice(i*CH,(i+1)*CH)})}
  else{try{const db=await this.idb();await new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(dataUrl,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){this.mem[id]=dataUrl}}
  return rec;
 },
 async get(id){
  if(this.mem[id])return this.mem[id];
  if(Store.mode==='fb'&&Store.fb){const q=await Store.fb.db.collection(Store.coll('files')).where('fid','==',id).get();return q.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).map(d=>d.data).join('')}
  try{const db=await this.idb();return await new Promise((res,rej)=>{const r=db.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}
 }
};

const readAsDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
function compressImage(file,max=360,q=.82){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=e=>{URL.revokeObjectURL(url);rej(e)};img.src=url})}

async function doLogin(username,pw){

 const m=S.team.find(x=>loginName(x.username)===u&&x.active!==false);

 if(m.passHash==='DEMO'?pw!=='plinth123':await hashPw(u,pw)!==m.passHash)throw new Error(t('badLogin'));
 prefs.me=m.id;savePrefs();return true;
}
async function setPassword(m,username,pw){
 const u=loginName(username);
 if(S.team.some(x=>x.id!==m.id&&loginName(x.username)===u))throw new Error(t('userTaken'));
 if(Store.mode==='fb'&&Store.fb){
  if(!m.uid){const sec=firebase.apps.find(a=>a.name==='pdt-sec')||firebase.initializeApp(Store.fb.app.options,'pdt-sec');
   const cred=await sec.auth().createUserWithEmailAndPassword(`${u}@${CFG().authDomain}`,pw);m.uid=cred.user.uid;await sec.auth().signOut();

  else if(Store.user&&Store.user.uid===m.uid)await Store.user.updatePassword(pw);

 }else m.passHash=await hashPw(u,pw);
 m.username=u;Store.put('team',m);
}

function startTimer(task){
 if(!prefs.me){return}if(!guard('task',task))return;
 const r=running(prefs.me);if(r){if(r.taskId===task.id)return;r.end=nowIso();Store.put('time',r)}
 const s={id:uid(),taskId:task.id,projectId:task.projectId,memberId:prefs.me,start:nowIso(),end:null};S.time.push(s);TIDX=null;Store.put('time',s);
 if(!task.assigneeId)task.assigneeId=prefs.me;if(task.status==='todo'||task.status==='done'){task.status='doing';task.doneAt=null}
 task.updatedAt=nowIso();Store.put('tasks',task);const p=proj(task.projectId);if(p){p.updatedAt=nowIso();Store.put('projects',p)}
 toast(t('timerStarted'));render();
}
function stopTimer(markDone){
 const r=running(prefs.me);if(!r)return;r.end=nowIso();Store.put('time',r);
 const x=S.tasks.find(y=>y.id===r.taskId);
 if(x&&markDone){setTaskStatus(x,'done');return}
 toast(t('timerStopped'));render();
}
function timerPill(){
 const r=prefs.me&&running(prefs.me);if(!r)return '';
 const x=S.tasks.find(y=>y.id===r.taskId),p=x&&proj(x.projectId);
 return `<div class="tpill"><span class="rec"></span><button class="tp-t" data-task="${r.taskId}"><b class="ellipsis">${esc(x?x.title:'')}</b><span class="ellipsis">${esc(p?p.name:'')}</span></button><span class="tp-c num" data-tick="${r.start}">${fmtClock(Date.now()-new Date(r.start))}</span><button class="icon-btn sm" data-act="stopTimer" title="${t('pause')}">${ic('pause')}</button><button class="icon-btn sm ok" data-act="doneTimer" title="${t('markDone')}">${ic('check')}</button></div>`;
}
setInterval(()=>{$$('[data-tick]').forEach(el=>{el.textContent=fmtClock(Date.now()-new Date(el.dataset.tick))})},1000);

const DEPTS=['design','technical','accounting','site','admin','management'];
const EMP_TYPES=['inhouse','outsource','parttime','freelance'];
const PF=[ // k, section, type, default rule (req|opt), options
 ['nameEn','personal','text','req'],['nameAr','personal','text','req'],['dob','personal','date','req'],['gender','personal','select','req',['male','female']],
 ['nationality','personal','text','req'],['marital','personal','select','opt',['single','married','other']],['idNo','personal','text','req'],['idExpiry','personal','date','opt'],
 ['military','personal','select','opt',['completed','exempted','postponed','na']],
 ['mobile','contact','tel','req'],['whatsapp','contact','tel','opt'],['email','contact','email','req'],['city','contact','text','req'],['address','contact','text','req'],
 ['emgName','contact','text','req'],['emgRel','contact','text','req'],['emgPhone','contact','tel','req'],
 ['role','work','text','req'],['dept','work','select','req',DEPTS],['empType','work','select','req',EMP_TYPES],['joinDate','work','date','req'],['office','work','office','opt'],
 ['degree','edu','text','req'],['university','edu','text','req'],['gradYear','edu','number','req'],['expYears','edu','number','req'],['skills','edu','chips','opt',SKILLS],['languages','edu','text','opt'],['portfolio','edu','url','opt'],['linkedin','edu','url','opt'],
 ['bankName','bank','text','opt'],['iban','bank','text','opt'],
];
const PF_SECTIONS=['personal','contact','work','edu','bank'];
const DOCS=[['cv','req'],['idFront','req'],['idBack','req'],['degreeCert','opt'],['militaryCert','opt'],['passport','opt'],['portfolioFile','opt']];
const ruleOf=k=>{const r=(CFG().fieldRules||{})[k];if(r)return r;const f=PF.find(x=>x[0]===k)||DOCS.find(x=>x[0]===k);return f?(f[3]||f[1]):'opt'};
const PRIVATE_FIELDS=['idNo','idExpiry','bankName','iban','dob','marital','military'];
const fieldLabel=k=>t('f_'+k);
const optLabel=(k,v)=>v==null||v===''?'—':(k==='dept'?t('d_'+v):k==='empType'?t('e_'+v):k==='office'?((CFG().offices.find(o=>o.id===v)||{}).name||v):['gender','marital','military'].includes(k)?t('o_'+v):Array.isArray(v)?v.join(' · '):v);

function fieldInput(f,val,pfx=''){
 const [k,,type,,opts]=f,rule=ruleOf(k);if(rule==='off')return '';
 const req=rule==='req',lab=`${fieldLabel(k)}${req?' *':''}`,nm=pfx+k;
 let inp='';
 if(type==='select')inp=`<select class="sel" name="${nm}" ${req?'required':''}><option value="">—</option>${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${esc(optLabel(k,o))}</option>`).join('')}</select>`;
 else if(type==='office')inp=`<select class="sel" name="${nm}"><option value="">—</option>${CFG().offices.map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
 else if(type==='chips')inp=`<div class="pick">${opts.map(o=>`<label><input type="checkbox" name="${nm}" value="${esc(o)}" ${(val||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
 else inp=`<input class="inp ${['tel','email','url','number'].includes(type)||k==='nameEn'||k==='iban'?'ltr':''}" type="${type}" name="${nm}" value="${esc(val??'')}" ${req?'required':''} ${type==='number'?'min="0"':''}>`;
 return fld(lab,inp,type==='chips'||k==='address');
}
function readFields(form,pfx=''){const out={};const fd=new FormData(form);PF.forEach(([k,,type])=>{if(ruleOf(k)==='off')return;out[k]=type==='chips'?fd.getAll(pfx+k):(fd.get(pfx+k)??'').toString().trim();if(type==='number'&&out[k]!=='')out[k]=+out[k]});return out}
function missingReq(vals){return PF.filter(([k])=>ruleOf(k)==='req').filter(([k])=>{const v=vals[k];return v==null||v===''||(Array.isArray(v)&&!v.length)}).map(([k])=>k)}

function joinCollect(){const f=$('#joinF');if(!f)return;const st=JOIN_STEPS[JOIN.step];if(['personal','contact','work','edu'].includes(st)){const v=readFields(f);PF.filter(x=>x[1]===st||(st==='edu'&&x[1]==='bank')).forEach(([k])=>{if(k in v)JOIN.vals[k]=v[k]})}if(st==='account'){JOIN.vals.username=loginName(f.username.value||JOIN.vals.username||'');JOIN.vals.consent=f.consent.checked||!!JOIN.ap}}
async function joinNext(){
 joinCollect();const st=JOIN_STEPS[JOIN.step],f=$('#joinF');
 if(['personal','contact','work','edu'].includes(st)){const miss=missingReq(JOIN.vals).filter(k=>{const x=PF.find(y=>y[0]===k);return x[1]===st||(st==='edu'&&x[1]==='bank')});if(st==='personal'&&!JOIN.photo){toast(t('photoReq'));return}if(miss.length){toast(t('required')+': '+miss.map(fieldLabel).join('، '));return}}
 if(st==='docs'){const miss=DOCS.filter(([k])=>ruleOf(k)==='req'&&!JOIN.files[k]);if(miss.length){toast(t('required')+': '+miss.map(([k])=>t('doc_'+k)).join('، '));return}}
 if(st==='account'){const u=JOIN.vals.username,pw=f.pw.value||JOIN.pw||'';if(JOIN.pw&&!f.pw2.value)f.pw2.value=JOIN.pw;JOIN.pw=pw;
  if(!/^[a-z0-9._-]{3,}$/.test(u)){toast(t('usernameHint'));return}if(pw.length<8||pw!==f.pw2.value){toast(t('pwMismatch'));return}if(!JOIN.vals.consent){toast(t('consentReq'));return}
  if(!JOIN.ap&&(S.team.some(m=>loginName(m.username)===u)||S.applicants.some(a=>a.username===u&&a.status==='pending'))){toast(t('userTaken'));return}
  const tok=location.hash.slice(6),inv=S.invites.find(i=>i.token===tok)||JOIN.inv;
  if(Store.mode==='fb'&&Store.fb)return joinSubmitFb(u,pw,tok);
  const ap={id:'a'+uid(),invite:tok,status:'pending',at:nowIso(),profile:JOIN.vals,photo:JOIN.photo,docs:JOIN.files,username:u};
  try{
   if(Store.mode==='fb'&&Store.fb){const cred=await Store.fb.auth.createUserWithEmailAndPassword(`${u}@${CFG().authDomain}`,pw);ap.uid=cred.user.uid;await Store.fb.db.collection(Store.coll('users')).doc(ap.uid).set({applicant:ap.id,status:'pending',invite:tok});await FileStore.flush()}
   else ap.passHash=await hashPw(u,pw);
  }catch(e){toast(e.message);return}
  delete ap.profile.consent;ap.consent={at:nowIso(),text:t('consentText')};
  S.applicants.unshift(ap);Store.put('applicants',ap);if(inv){inv.status='used';inv.usedAt=nowIso();Store.put('invites',inv)}
  notifyAdmins('nt_join',{n:ap.profile.nameEn||u},'approvals','join');JOIN.done=true;render();return}
 JOIN.step++;render();scrollTo(0,0);
}

async function joinSubmitFb(u,pw,tok){
 if(JOIN.busy)return;
 const db=Store.fb.db,auth=Store.fb.auth,email=`${u}@${CFG().authDomain}`;
 let ap=JOIN.ap;
 if(!ap||ap.username!==u){ap={id:'a'+uid(),invite:tok,status:'pending',at:nowIso(),profile:Object.assign({},JOIN.vals),photo:JOIN.photo||null,docs:JOIN.files,username:u};delete ap.profile.consent;ap.consent={at:nowIso(),text:t('consentText')};JOIN.ap=ap;JOIN.uid=null}
 JOIN.busy=true;JOIN.err='';render();
 const fail=(step,e)=>{console.warn('[join]',step,e);JOIN.busy=false;const c=(e&&(e.code||e.message))||String(e);JOIN.err=t('js_err_'+step)+(c?' — '+c:'');render()};
 // 1 · the login (created once; a retry signs back in with the same password)
 try{
  if(!JOIN.uid){try{const c=await auth.createUserWithEmailAndPassword(email,pw);JOIN.uid=c.user.uid}
   catch(e){if(e.code!=='auth/email-already-in-use')throw e;const c=await auth.signInWithEmailAndPassword(email,pw).catch(()=>{throw {code:'userTaken'}});JOIN.uid=c.user.uid}}
  else if(!auth.currentUser||auth.currentUser.uid!==JOIN.uid){const c=await auth.signInWithEmailAndPassword(email,pw);JOIN.uid=c.user.uid}
 }catch(e){if(e.code==='userTaken'){JOIN.busy=false;JOIN.ap=null;JOIN.err=t('userTaken');render();return}return fail('account',e)}
 ap.uid=JOIN.uid;
 // 2 · documents
 try{await FileStore.flush()}catch(e){return fail('files',e)}
 // 3 · the profile itself (needs the invite still open)
 try{await db.collection(Store.coll('applicants')).doc(ap.id).set(JSON.parse(JSON.stringify(ap)))}
 catch(e){return fail(e.code==='permission-denied'?'invite':'profile',e)}
 // 4 · the pending access record (skipped if a previous attempt already made it)
 try{const ref=db.collection(Store.coll('users')).doc(ap.uid),d=await ref.get();if(!d.exists)await ref.set({applicant:ap.id,status:'pending',invite:tok})}
 catch(e){return fail('access',e)}
 // 5 · close the invite and tell the admins (never blocks the applicant)
 try{await db.collection(Store.coll('invites')).doc(tok).update({status:'used',usedAt:nowIso()})}catch(e){console.warn('[join] invite',e)}
 try{notifyAdmins('nt_join',{n:ap.profile.nameEn||u},'approvals','join')}catch(e){}
 JOIN.busy=false;JOIN.err='';JOIN.done=true;render();scrollTo(0,0);
}

const HR_TYPES={
 annual:{ic:'sun',f:['from','to'],leave:1},
 sick:{ic:'fire',f:['from','to','attach'],leave:1},
 casual:{ic:'hour',f:['from','to'],leave:1},
 permission:{ic:'clock',f:['date','fromTime','toTime']},
 wfh:{ic:'home',f:['from','to']},
 mission:{ic:'pin',f:['from','to','place']},
 overtime:{ic:'spark',f:['date','hours','project']},

const LETTERS=['salary','experience','employment','embassy'];
function workDays(a,b){if(!a||!b||b<a)return 0;const wk=CFG().weekend;let n=0;for(let d=parse(a);d<=parse(b);d.setDate(d.getDate()+1))if(!wk.includes(d.getDay()))n++;return n}
function leaveBalance(mid){
 const m=member(mid),y=String(new Date().getFullYear());
 const used=k=>sum(S.hr.filter(h=>h.memberId===mid&&h.type===k&&h.status==='approved'&&(h.from||'').startsWith(y)),h=>workDays(h.from,h.to));
 const quota=(m&&m.leaveQuota)||CFG().annualLeave;return {quota,used:used('annual'),sick:used('sick'),casual:used('casual'),left:quota-used('annual')-used('casual')};
}
function hrSummary(h){
 const d=x=>fmtD(x,{day:'numeric',month:'short'});
 if(h.from)return `${d(h.from)}${h.to&&h.to!==h.from?' → '+d(h.to):''} · ${workDays(h.from,h.to||h.from)} ${t('days')}`;
 if(h.date)return `${d(h.date)}${h.fromTime?` · ${h.fromTime}–${h.toTime}`:''}${h.hours?` · ${h.hours}${t('hrs')}`:''}`;
 if(h.amount)return `${fmtN(h.amount)} ${h.currency||''}${h.months?` · ${h.months} ${t('months')}`:''}`;
 if(h.letterType)return t('lt_'+h.letterType)+(h.addressedTo?' · '+h.addressedTo:'');
 if(h.lastDay)return t('lastDay')+': '+d(h.lastDay);
 return h.item||'';
}

/* ---------- performance ---------- */
function memberPerf(mid,days=30){
 const from=addDays(TODAY(),-days);
 const done=S.tasks.filter(x=>x.assigneeId===mid&&x.status==='done'&&x.doneAt&&x.doneAt.slice(0,10)>=from);
 const hours=sum(S.time.filter(x=>x.memberId===mid&&x.start.slice(0,10)>=from),sessH);
 const rated=done.filter(x=>+x.estH&&actualH(x)>0);
 const speed=rated.length?sum(rated,x=>+x.estH)/sum(rated,actualH):0;
 const dd=done.filter(x=>x.due);const onTime=dd.length?Math.round(dd.filter(x=>x.doneAt.slice(0,10)<=x.due).length/dd.length*100):null;
 return {done:done.length,hours,speed,onTime};
}
function viewPerf(){
 const days=ui.perfDays||90,from=addDays(TODAY(),-days);
 const team=activeTeam().filter(m=>m.access!=='viewer');
 const rows=team.map(m=>({m,...memberPerf(m.id,days)})).filter(r=>r.done||r.hours).sort((a,b)=>b.speed-a.speed);
 const groups={};S.tasks.filter(x=>x.status==='done'&&x.doneAt&&x.doneAt.slice(0,10)>=from&&actualH(x)>0&&x.assigneeId).forEach(x=>{const k=x.key||x.title.trim().toLowerCase();(groups[k]=groups[k]||[]).push(x)});
 const gl=Object.entries(groups).filter(([,v])=>v.length>=2&&new Set(v.map(x=>x.assigneeId)).size>=2).map(([k,v])=>{const avg=sum(v,actualH)/v.length;const per={};v.forEach(x=>{(per[x.assigneeId]=per[x.assigneeId]||[]).push(actualH(x))});
  return {k,label:tt(v[0]),n:v.length,est:sum(v,x=>+x.estH||0)/v.length,avg,per:Object.entries(per).map(([mid,hs])=>({m:member(mid),h:sum(hs,x=>x)/hs.length,n:hs.length})).sort((a,b)=>a.h-b.h)}}).sort((a,b)=>b.n-a.n);
 const mx=Math.max(1.5,...rows.map(r=>r.speed));
 return `<div class="toolbar"><div class="seg">${[30,90,180].map(d=>`<button class="${days===d?'on':''}" data-act="perfDays" data-v="${d}">${d} ${t('days')}</button>`).join('')}</div><span class="grow"></span><span class="small muted">${t('perfHint')}</span></div>
 <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>${t('member')}</th><th>${t('tasksDone')}</th><th>${t('hoursLogged')}</th><th style="min-width:200px">${t('speedIndex')}</th><th>${t('onTimeRate')}</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="clk" data-go="m-${r.m.id}"><td><div class="row" style="gap:8px">${av(r.m,28)}<span>${esc(mName(r.m))}</span></div></td><td class="num">${r.done}</td><td class="num">${fmtDur(r.hours)}</td><td><div class="row" style="gap:8px"><div class="bar grow" style="height:7px"><i style="width:${r.speed/mx*100}%;background:${r.speed>=1?'var(--ok)':r.speed>=.8?'var(--risk)':'var(--late)'}"></i></div><b class="num" style="font-weight:500;width:48px">${r.speed?r.speed.toFixed(2)+'×':'—'}</b></div></td><td class="num">${r.onTime!=null?r.onTime+'%':'—'}</td></tr>`).join('')||`<tr><td colspan="5" class="muted">${t('noData')}</td></tr>`}
 </tbody></table></div>
 <h2 class="sec">${ic('cols')}${t('similarTasks')}</h2>
 ${gl.length?`<div class="cmp-grid">${gl.slice(0,24).map(g=>{const top=Math.max(g.est,...g.per.map(p=>p.h));return `<div class="card cmp"><div class="row"><b class="grow ellipsis" style="font-weight:500">${esc(g.label)}</b><span class="chip num">${g.n}×</span></div><div class="small muted">${t('estimate')} <b class="num">${fmtDur(g.est)}</b> · ${t('teamAvg')} <b class="num">${fmtDur(g.avg)}</b></div>
  <div class="cmp-bars">${g.per.map((p,i)=>`<div class="cb-row">${av(p.m,22)}<span class="ellipsis small" style="width:84px">${esc(first(p.m))}</span><div class="bar grow" style="height:8px;position:relative"><i style="width:${p.h/top*100}%;background:${p.h<=g.avg?'var(--ok)':'var(--risk)'}"></i></div><b class="num small" style="width:62px;text-align:end;font-weight:500">${fmtDur(p.h)}</b>${i===0?`<span title="${t('fastest')}">⚡</span>`:'<span style="width:16px"></span>'}</div>`).join('')}</div></div>`}).join('')}</div>`:`<div class="card empty">${t('noCompare')}</div>`}`;
}

}

const FS_RULES=p=>`rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null; }
    function user() { return get(/databases/$(db)/documents/${p}users/$(request.auth.uid)).data; }
    function active() { return signedIn() && exists(/databases/$(db)/documents/${p}users/$(request.auth.uid)) && user().status == 'active'; }
    // invitations: readable by token, used once by the applicant
    match /${p}invites/{tok} { allow get: if true; allow list, create, delete: if active();
      allow update: if active() || (signedIn() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','usedAt'])); }
    // applicants create their own pending record
    match /${p}applicants/{id} { allow create: if signedIn() && request.resource.data.status == 'pending'; allow read, update, delete: if active(); }
    match /${p}users/{uid} { allow get: if signedIn() && request.auth.uid == uid; allow create: if signedIn() && request.auth.uid == uid && request.resource.data.status == 'pending'; allow read, write: if active(); }
    match /${p}notifs/{id} { allow create: if signedIn(); allow read, update, delete: if active(); }
    match /${p}files/{id} { allow create: if signedIn(); allow read, delete: if active(); }
    // everything else: active team members only
    match /${p}portals/{tok} { allow get: if true; allow write: if active(); match /msgs/{id} { allow read, create: if true; allow update, delete: if active(); } }
    match /${p}comp/{id} { allow read, write: if active() && (user().finance == true || user().admin == true); }
    match /${p}slips/{id} { allow read: if active() && (user().finance == true || user().admin == true || resource.data.memberId == user().memberId); allow write: if active() && (user().finance == true || user().admin == true); }
    match /{coll}/{id} { allow read, write: if active() && coll.matches('${p}.*') && !(coll in ['${p}comp','${p}slips']); }
  }
}`;

function holidayDates(country){const out=new Set();S.holidays.filter(h=>h.approved&&(h.country==='ALL'||!country||h.country===country)).forEach(h=>{for(let i=0;i<(h.days||1);i++)out.add(addDays(h.date,i))});return out}

function workDays(a,b,country){if(!a||!b||b<a)return 0;const wk=CFG().weekend,hol=holidayDates(country);let n=0;for(let d=parse(a);d<=parse(b);d.setDate(d.getDate()+1)){const s=iso(d);if(!wk.includes(d.getDay())&&!hol.has(s))n++}return n}

function calcSlip(mid,ym){
 const m=member(mid),c=compOf(mid)||{basic:0,allowances:0,currency:'EGP'},pc=PAYCFG(),cty=memberCountry(m);
 const day=(+c.basic||0)/pc.divisor,hour=day/pc.hoursDay;
 const first=ym+'-01',lastD=iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0)),end=lastD<TODAY()?lastD:TODAY();
 const att=S.attendance.filter(a=>a.memberId===mid&&a.date.startsWith(ym)&&a.in).sort((a,b)=>a.date<b.date?-1:1);
 const lates=att.map(a=>({date:a.date,min:lateMinutes(a)})).filter(x=>x.min>CFG().grace);
 let lateDays=0,counted=0;const lateLines=lates.map((x,i)=>{const tier=pc.tiers.find(t=>x.min>=t.from&&x.min<=t.to);const free=i<pc.freeLates;const ded=!free&&tier?tier.ded:0;lateDays+=ded;if(ded)counted++;return Object.assign({},x,{ded,free})});
 const covered=new Set(att.map(a=>a.date)),hol=holidayDates(cty),wk=CFG().weekend;
 S.hr.filter(h=>h.memberId===mid&&h.status==='approved'&&h.from).forEach(h=>{for(let d=parse(h.from);d<=parse(h.to||h.from);d.setDate(d.getDate()+1))covered.add(iso(d))});
 S.down.filter(x=>x.memberId===mid).forEach(x=>covered.add(x.start.slice(0,10)));
 let absent=[];const ex=(m&&m.profile&&m.profile.empType)||'inhouse';
 if(ex==='inhouse'){const join=(m.profile&&m.profile.joinDate)||first;for(let d=parse(first);iso(d)<=end;d.setDate(d.getDate()+1)){const s=iso(d);if(s<join||s===TODAY())continue;if(!wk.includes(d.getDay())&&!hol.has(s)&&!covered.has(s))absent.push(s)}}
 const unpaid=sum(S.hr.filter(h=>h.memberId===mid&&h.type==='unpaid'&&h.status==='approved'&&(h.from||'').startsWith(ym)),h=>workDays(h.from,h.to,cty));
 const otH=sum(S.hr.filter(h=>h.memberId===mid&&h.type==='overtime'&&h.status==='approved'&&(h.date||'').startsWith(ym)),h=>+h.hours||0);
 const adv=sum(S.hr.filter(h=>h.memberId===mid&&h.type==='advance'&&h.status==='approved'&&h.decidedAt).filter(h=>{const st=h.decidedAt.slice(0,7);const n=+h.months||1;const k=(+ym.slice(0,4)-+st.slice(0,4))*12+(+ym.slice(5,7)-+st.slice(5,7));return k>=1&&k<=n}),h=>(+h.amount||0)/(+h.months||1));
 const exp=sum(S.hr.filter(h=>h.memberId===mid&&h.type==='expense'&&h.status==='approved'&&(h.decidedAt||'').startsWith(ym)),h=>+h.amount||0);
 const r=v=>Math.round(v*100)/100;
 return {basic:r(+c.basic||0),allow:r(+c.allowances||0),ot:r(otH*hour*pc.otRate),otH,exp:r(exp),lateDed:r(lateDays*day),lateDays,lateLines,absDed:r(absent.length*day),absent,unpaidDed:r(unpaid*day),unpaid,advDed:r(adv),currency:c.currency||'EGP',day:r(day)};
}
function slipOf(mid,ym){return S.slips.find(s=>s.id===mid+'_'+ym)}
function slipTotals(calc,s){const o=Object.assign({},calc,(s&&s.over)||{});const add=o.basic+o.allow+o.ot+o.exp+(+o.otherAdd||0),ded=o.lateDed+o.absDed+o.unpaidDed+o.advDed+(+o.otherDed||0);return {o,add,ded,net:Math.round((add-ded)*100)/100}}

/* ---------- golden buzz / birthday takeover ---------- */
function confetti(host,gold){
 const cv=document.createElement('canvas');cv.className='confetti';host.appendChild(cv);const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);
 const W=()=>cv.width=host.clientWidth*dpr,H=()=>cv.height=host.clientHeight*dpr;W();H();
 const cols=gold?['#F7E7A1','#D8B878','#FFF6D6','#B8923F','#ffffff']:['#38E07B','#F4B64A','#8DB1FF','#FF6A5C','#D8B878','#ffffff'];
 const P=[...Array(160)].map(()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3)*dpr,s:(4+Math.random()*6)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:cols[Math.floor(Math.random()*cols.length)]}));
 let n=0;(function f(){if(!cv.isConnected)return;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>cv.height&&n<260){p.y=-20;p.x=Math.random()*cv.width}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(++n<420)requestAnimationFrame(f);else cv.remove()})();
}
function takeover(){
 if($('#gb')||$('#ov')||!prefs.me)return;
 const y=TODAY().slice(0,4);
 const mineBd=todaysBirthdays().find(m=>m.id===prefs.me);prefs.bdSeen=prefs.bdSeen||{};
 if(mineBd&&prefs.bdSeen[y]!==TODAY()){prefs.bdSeen[y]=TODAY();savePrefs();
  const b=bdBuzz(prefs.me);const ws=(b&&b.wishes)||[];
  showTakeover(`<div class="gb-in"><div class="gb-e">🎂</div><div class="eyebrow">${t('bdEyebrow')}</div><h1>${t('bdHappy',{m:first(me())})}</h1><p>${t('bdMsg')}</p>${ws.length?`<div class="gb-wishes">${ws.slice(-6).map(w=>`<div>${av(member(w.from),28)}<span><b>${esc(first(member(w.from)))}</b> ${esc(w.text)}</span></div>`).join('')}</div>`:''}<button class="btn gb-btn" data-gbclose>${t('thanksTeam')}</button></div>`,true);return}
 const g=S.buzz.find(b=>b.golden&&!(b.seen||[]).includes(prefs.me)&&diff(b.at.slice(0,10),TODAY())<=7);
 if(g){g.seen=[...(g.seen||[]),prefs.me];Store.put('buzz',g);const cheers=g.cheers||{};
  showTakeover(`<div class="gb-in"><div class="gb-e">${BUZZ_IC[g.icon]||'⭐'}</div><div class="eyebrow">GOLDEN BUZZ</div>${g.kind==='person'?`<div class="avs gb-avs">${(g.targets||[]).map(i=>av(member(i),84)).join('')}</div>`:''}<h1>${esc(g.title)}</h1><div class="gb-who">${esc(buzzName(g))}</div>${g.msg?`<p>${esc(g.msg)}</p>`:''}<div class="bz-cheers">${['👏','🔥','❤️','🎉','💯','🙌'].map(e=>`<button class="${(cheers[e]||[]).includes(prefs.me)?'on':''}" data-cheer="${g.id}" data-e="${e}">${e} <span class="num">${(cheers[e]||[]).length||''}</span></button>`).join('')}</div><button class="btn gb-btn" data-gbclose>${t('continue')}</button></div>`,true)}
}
function showTakeover(html,gold){const d=document.createElement('div');d.id='gb';d.className='gb '+(gold?'gold':'');d.innerHTML=html;document.body.appendChild(d);confetti(d,gold);d.addEventListener('click',e=>{if(e.target.closest('[data-gbclose]'))d.remove()})}

/* ---------- birthdays ---------- */

  <div class="row" style="margin-top:14px">${['🎉','🎂','🥳','🎁','❤️'].map(e=>`<button class="btn sm" data-wq="${e}">${e}</button>`).join('')}</div><textarea class="inp" id="wishT" style="width:100%;min-height:70px;margin-top:10px;padding:10px" placeholder="${t('wishPh')}"></textarea><button class="btn acc" id="wishGo" style="width:100%;margin-top:10px">${t('sendWish')}</button></div>`,'narrow bz-modal');
 ov.addEventListener('click',e=>{const q=e.target.closest('[data-wq]');if(q){const a=$('#wishT',ov);a.value+=q.dataset.wq;a.focus()}});
 $('#wishGo',ov).onclick=()=>{const v=$('#wishT',ov).value.trim();if(!v)return;let b=bdBuzz(mid);if(!b)b=createBuzz({kind:'birthday',targets:[mid],title:t('bdToday',{m:mName(m)}),icon:'birthday',year:TODAY().slice(0,4)});b.wishes=[...(b.wishes||[]),{from:prefs.me,text:v,at:nowIso()}];Store.put('buzz',b);notify(mid,'nt_wish',{m:mName(me())},'home','buzz');closeModal();toast(t('wishSent'))};

// sessions awaiting approval don't count
const sessOk=s=>!s.status||s.status==='approved';
actualH=task=>(+task.manualH||0)+(timeIdx()[task.id]||[]).filter(sessOk).reduce((s,x)=>s+sessH(x),0);
const leftH=x=>(+x.estH||0)-actualH(x);
function budgetBar(x){
 const e=+x.estH||0;if(!e||x.status==='done')return '';const a=actualH(x),p=a/e,l=e-a;
 return `<div class="bud ${p>1?'over':p>.8?'warn':''}"><div class="bar"><i style="width:${Math.min(100,p*100)}%"></i></div><span class="num">${l>=0?t('leftOf',{l:fmtDur(l),e:fmtDur(e)}):t('overBy',{o:fmtDur(-l)})}</span></div>`;
}

/* ---------- nudges: forgot the timer / long timers ---------- */
function nudgeCheck(){if(/^#(client|join)-/.test(location.hash)){const n=document.getElementById('nudge');if(n)n.remove();return}
 const el=$('#nudge');if(el)return;const m=me();if(!m||$('#ov')||$('#gb')||Store.mode==='fb'&&!Store.user)return;
 const a=attToday(m.id),now=Date.now();prefs.snooze=prefs.snooze||0;if(now<prefs.snooze)return;
 const r=running(m.id);
 if(r){const h=sessH(r);if(h>=4&&!(ui.longAsked===r.id)){ui.longAsked=r.id;const x=S.tasks.find(y=>y.id===r.taskId);showNudge(`<b>${t('stillWorking',{t:x?tt(x):''})}</b><span>${t('longTimer',{h:fmtDur(h)})}</span><div class="row" style="margin-top:8px"><button class="btn sm acc" data-nudge="keep">${t('yesWorking')}</button><button class="btn sm" data-nudge="stop">${t('stopNow')}</button></div>`)}return}
 if(!a||!a.in||a.out||myDown())return;
 const sinceIn=(now-new Date(a.in.at))/6e4,lastEnd=S.time.filter(s=>s.memberId===m.id&&s.end).reduce((x,s)=>s.end>x?s.end:x,a.in.at),idle=(now-new Date(lastEnd))/6e4;
 const [eh,em]=CFG().workEnd.split(':').map(Number),d=new Date();if(d.getHours()*60+d.getMinutes()>eh*60+em)return;
 if(sinceIn>=15&&idle>=20){const mine=S.tasks.filter(x=>x.assigneeId===m.id&&x.status!=='done'&&(()=>{const p=proj(x.projectId);return p&&isActive(p)})()).sort((x,y)=>(x.status==='doing'?0:1)-(y.status==='doing'?0:1)||((x.due||'9')<(y.due||'9')?-1:1)).slice(0,4);
  showNudge(`<b>${t('whatNow')}</b><span>${t('whatNowSub',{m:Math.round(idle)})}</span><div class="ng-list">${mine.map(x=>`<button data-nudge="start" data-id="${x.id}">${ic('play')}<span class="grow ellipsis">${esc(tt(x))}</span><span class="small muted">${esc((proj(x.projectId)||{}).code||'')}</span></button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-nudge="down">${ic('alert')}${t('reportProblem')}</button><button class="btn sm ghost" data-nudge="snooze">${t('snooze30')}</button></div>`)}
}
function showNudge(html){const d=document.createElement('div');d.id='nudge';d.className='nudge card';d.innerHTML=`<button class="icon-btn sm ng-x" data-nudge="snooze">${ic('x')}</button><span class="ng-ic">⏱️</span><div class="grow">${html}</div>`;document.body.appendChild(d);
 d.addEventListener('click',e=>{const b=e.target.closest('[data-nudge]');if(!b)return;const k=b.dataset.nudge;d.remove();
  if(k==='start'){const x=S.tasks.find(y=>y.id===b.dataset.id);if(x)startTimer(x)}else if(k==='down')downForm();else if(k==='stop')stopTimer(false);else if(k==='snooze'){prefs.snooze=Date.now()+30*6e4;savePrefs()}})}
setInterval(()=>{try{nudgeCheck()}catch(e){}},60000);

/* ---------- KPI & scoring ---------- */
const DEFAULT_KPIW={ontime:30,speed:25,quality:15,punct:15,rating:15};
const KPIW=()=>Object.assign({},DEFAULT_KPIW,CFG().kpiW||{});
function kpiOf(mid,ym){
 const from=ym+'-01',to=iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0));
 const done=S.tasks.filter(x=>x.assigneeId===mid&&x.status==='done'&&x.doneAt&&x.doneAt.slice(0,10)>=from&&x.doneAt.slice(0,10)<=to);
 const c={};
 const dd=done.filter(x=>x.due);if(dd.length)c.ontime=dd.filter(x=>x.doneAt.slice(0,10)<=x.due).length/dd.length*100;
 const rated=done.filter(x=>+x.estH&&actualH(x)>0);if(rated.length){const sp=sum(rated,x=>+x.estH)/sum(rated,actualH);c.speed=clamp((sp-.6)/.6,0,1)*100}
 const rv=done.filter(x=>x.proof);if(rv.length)c.quality=rv.filter(x=>!(x.reviewRounds>0)).length/rv.length*100;
 const at=S.attendance.filter(a=>a.memberId===mid&&a.date>=from&&a.date<=to&&a.in);if(at.length)c.punct=at.filter(a=>!isLate(a)).length/at.length*100;
 const r=S.ratings.find(x=>x.id===mid+'_'+ym);if(r)c.rating=(r.score-1)/4*100;
 const w=KPIW();let tw=0,ts=0;Object.entries(c).forEach(([k,v])=>{tw+=w[k];ts+=w[k]*v});
 const score=tw?Math.round(ts/tw):null;
 return {c,score,grade:score==null?'—':score>=90?'A+':score>=80?'A':score>=70?'B':score>=60?'C':'D',done:done.length,rating:r};
}
const gradeCls=g=>({'A+':'ok','A':'ok','B':'done','C':'risk','D':'late'})[g]||'hold';
function scoreRing(v,size=64,g){const r=27,c=2*Math.PI*r,p=v==null?0:v/100;return `<div class="sring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--${gradeCls(g)})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b class="num">${v==null?'—':v}</b></div>`}
function viewKpi(){
 const ym=ui.kpiYm||TODAY().slice(0,7),w=KPIW();
 const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);return iso(d).slice(0,7)});
 const vis=activeTeam().filter(m=>m.access!=='viewer'&&deptOf(m)!=='management'&&(P('kpi.viewAll')||m.id===prefs.me||m.seniorId===prefs.me||m.managerId===prefs.me));
 const rows=vis.map(m=>({m,k:kpiOf(m.id,ym)})).sort((a,b)=>(b.k.score??-1)-(a.k.score??-1));
 const comp=['ontime','speed','quality','punct','rating'];
 return `<div class="toolbar"><div class="seg">${months.map(x=>`<button class="${x===ym?'on':''}" data-act="kpiYm" data-v="${x}">${fmtD(x+'-01',{month:'short',year:'2-digit'})}</button>`).join('')}</div><span class="grow"></span><span class="small muted">${comp.map(k=>`${t('k_'+k)} ${w[k]}%`).join(' · ')}</span>${P('kpi.manage')?`<button class="btn sm" data-act="kpiW">${ic('gear')}</button>`:''}</div>
 <div class="kpi-grid">${rows.map(({m,k},i)=>`<div class="card kpic">${i<3&&k.score!=null?`<span class="medal">${['🥇','🥈','🥉'][i]}</span>`:''}<div class="row">${scoreRing(k.score,64,k.grade)}<div class="grow"><b style="font-weight:500;font-size:15px">${esc(mName(m))}</b><div class="small" style="color:var(--gold)">${esc(plinthy(m))}</div><span class="chip h-${gradeCls(k.grade)}">${k.grade} · ${t(k.score==null?'noData':k.score>=90?'g_out':k.score>=80?'g_exc':k.score>=70?'g_good':k.score>=60?'g_fair':'g_low')}</span></div></div>
  <div class="kc-bars">${comp.map(c=>`<div class="kb"><span>${t('k_'+c)}</span><div class="bar"><i style="width:${k.c[c]??0}%;${k.c[c]==null?'opacity:.2':''}"></i></div><b class="num">${k.c[c]==null?'—':Math.round(k.c[c])}</b></div>`).join('')}</div>
  <div class="row small"><span class="muted grow">${k.done} ${t('tasksDone')}${k.rating&&k.rating.note?' · “'+esc(k.rating.note)+'”':''}</span>${(isOwnerAdmin()||(P('kpi.rate')&&(m.seniorId===prefs.me||m.managerId===prefs.me)))&&m.id!==prefs.me?`<button class="btn sm" data-act="rateMember" data-id="${m.id}" data-v="${ym}">${ic('spark')}${k.rating?'★'.repeat(k.rating.score):t('rate')}</button>`:''}</div></div>`).join('')}</div>`;
}

   if(kind==='changes'){local.revisions=local.revisions||[];local.revisions.push({id:uid(),date:TODAY(),stage:it.stage,round:local.revisions.length+1,note:(it.title+': '+(text||'')).trim(),status:'open',by:'client'})}Store.put('projects',local)}

function storyStats(p){const ts=S.tasks.filter(x=>x.projectId===p.id),hrs=sum(ts,actualH),team=new Set(ts.map(x=>x.assigneeId).filter(Boolean));const s0=p.stages[0],sl=p.stages[p.stages.length-1];
 return {days:diff(p.start,(sl.doneAt||p.due).slice(0,10)),tasks:ts.length,hours:Math.round(hrs),team:[...team],revs:(p.revisions||[]).length,renders:ts.filter(x=>x.stage==='3d').length}}

function narrationScript(s,p,client){
 const st=storyStats(p),ar=prefs.lang==='ar',lines=x=>(x||'').split('\n').map(y=>y.trim()).filter(Boolean);
 const team=st.team.map(i=>first(member(i))).join(ar?'، ':', ');
 const parts=ar?[`[المشهد 1 — افتتاح] ${p.name}${p.location?'، '+p.location:''}. حكاية مشروع من Plinth & Partners.`,s.challenge&&`[المشهد 2 — التحدي] ${s.challenge}`,s.idea&&`[المشهد 3 — الفكرة] ${s.idea}`,`[المشهد 4 — الرحلة] في ${st.days} يوماً، مرّ المشروع بثماني مراحل${client?'':`، و${st.tasks} مهمة، و${st.hours} ساعة عمل`}. ${s.journey||''}`,s.outcome&&`[المشهد 5 — النتيجة] ${s.outcome}`,s.quote&&`[اقتباس] "${s.quote}"`,!client&&lines(s.good).length&&`[ما نجح] ${lines(s.good).join(' — ')}`,!client&&lines(s.improve).length&&`[ما نتعلمه] ${lines(s.improve).join(' — ')}`,`[الختام] ${client?'شكراً لثقتكم.':'شكراً للفريق: '+team+'.'} Plinth & Partners.`]
  :[`[Scene 1 — Opening] ${p.name}${p.location?', '+p.location:''}. A project story by Plinth & Partners.`,s.challenge&&`[Scene 2 — The challenge] ${s.challenge}`,s.idea&&`[Scene 3 — The idea] ${s.idea}`,`[Scene 4 — The journey] Over ${st.days} days the project moved through eight stages${client?'':`, ${st.tasks} tasks and ${st.hours} working hours`}. ${s.journey||''}`,s.outcome&&`[Scene 5 — The result] ${s.outcome}`,s.quote&&`[Quote] "${s.quote}"`,!client&&lines(s.good).length&&`[What worked] ${lines(s.good).join(' — ')}`,!client&&lines(s.improve).length&&`[What we learn] ${lines(s.improve).join(' — ')}`,`[Closing] ${client?'Thank you for your trust.':'Thank you to the team: '+team+'.'} Plinth & Partners.`];
 return parts.filter(Boolean).join('\n\n');
}

 if(Store.mode!=='fb'||!Store.fb)return _setPwLocal(m,username,pw);
 const u=loginName(username);
 if(!/^[a-z0-9._-]{3,}$/.test(u))throw new Error(t('usernameHint'));
 if(S.team.some(x=>x.id!==m.id&&loginName(x.username)===u))throw new Error(t('userTaken'));
 const cu=Store.fb.auth.currentUser;
 if(cu&&m.uid&&m.uid===cu.uid){await cu.updatePassword(pw);return}
 if(!isOwnerAdmin())throw new Error(t('noPerm'));
 const sec=firebase.apps.find(a=>a.name==='pdt-sec')||firebase.initializeApp(Store.fb.app.options,'pdt-sec');
 let cred;try{cred=await sec.auth().createUserWithEmailAndPassword(`${u}@${FB_AUTH_DOMAIN}`,pw)}catch(e){if(e.code==='auth/email-already-in-use')throw new Error(t('pwResetFb'));throw e}
 const old=m.uid;m.uid=cred.user.uid;await sec.auth().signOut();
 await Store.fb.db.collection(Store.coll('users')).doc(m.uid).set(usersDocFor(m,{mustChange:true}));
 if(old&&old!==m.uid)Store.fb.db.collection(Store.coll('users')).doc(old).update({status:'disabled'}).catch(()=>{});
 m.username=u;Store.put('team',m);
};

/* ---------- private files: chunked, owner-stamped, HR scope admin-only ---------- */
const _fsPutLocal=FileStore.put,_fsGetLocal=FileStore.get;
FileStore.pendingUp={};
async function fbChunks(id,dataUrl,scope){const CH=900000,n=Math.ceil(dataUrl.length/CH);for(let i=0;i<n;i++)await Store.fb.db.collection(Store.coll('files')).doc(id+'_'+i).set({fid:id,i,n,scope,ownerUid:fbUid(),data:dataUrl.slice(i*CH,(i+1)*CH)})}
FileStore.put=async function(file,dataUrl,scope){
 if(Store.mode!=='fb'||!Store.fb)return _fsPutLocal.call(this,file,dataUrl);
 const rec={id:'f'+secTok(20),name:file.name,type:file.type||'',size:file.size||dataUrl.length*.75,at:nowIso()};
 this.mem[rec.id]=dataUrl;scope=scope==='work'?'work':'hr';
 if(!fbUid()){this.pendingUp[rec.id]={dataUrl,scope};return rec} // join form: uploaded right after the account exists
 await fbChunks(rec.id,dataUrl,scope);return rec;
};
FileStore.flush=async function(){for(const id of Object.keys(this.pendingUp)){const x=this.pendingUp[id];await fbChunks(id,x.dataUrl,x.scope);delete this.pendingUp[id]}};
FileStore.get=async function(id){
 if(this.mem[id])return this.mem[id];
 if(Store.mode!=='fb'||!Store.fb)return _fsGetLocal.call(this,id);
 try{const col=Store.fb.db.collection(Store.coll('files')),d0=await col.doc(id+'_0').get();if(!d0.exists)return null;const n=d0.data().n||1,parts=[d0.data().data];
  for(let i=1;i<n;i++){const d=await col.doc(id+'_'+i).get();parts.push(d.exists?d.data().data:'')}return this.mem[id]=parts.join('')}catch(e){toast(t('noPerm'));return null}
};

/* ---------- client portal: doc id = SHA-256(token+PIN), nothing readable without both ---------- */
syncPortal=async function(p){
 if(!p.portal||Store.mode!=='fb'||!Store.fb)return;
 const key=await portalKey(p.portal.token,p.portal.pin),col=Store.fb.db.collection(Store.coll('portals'));
 if(p.portal.key&&p.portal.key!==key)col.doc(p.portal.key).delete().catch(()=>{});
 if(p.portal.key!==key){p.portal.key=key;Store.put('projects',p)}
 if(p.portal.on===false){col.doc(key).delete().catch(()=>{});return}
 const doc={pid:p.id,name:p.name,code:p.code,client:p.client||'',location:p.location||'',start:p.start,due:p.due,progress:progress(p),health:health(p),
  stages:p.stages.map(s=>({k:s.k,en:stageDef(p,s.k).en,ar:stageDef(p,s.k).ar,c:stageDef(p,s.k).c,status:s.status,start:s.start,end:s.end,doneAt:s.doneAt})),shared:(p.shared||[]).map(x=>Object.assign({},x,{file:null})),storyId:''};
 col.doc(key).set(JSON.parse(JSON.stringify(doc))).catch(fbErr('portals',key));
};
function portalWatch(){
 if(Store.mode!=='fb'||!Store.fb||!(P('proj.portal')||access()==='lead'))return;
 S.projects.filter(p=>p.portal&&p.portal.key&&!PORTAL_W[p.portal.key]&&(P('proj.portal')||p.leadId===prefs.me)).forEach(p=>{
  const key=p.portal.key,ref=Store.fb.db.collection(Store.coll('portals')).doc(key).collection('msgs');
  PORTAL_W[key]=ref.onSnapshot(snap=>{const list=snap.docs.map(d=>Object.assign(fbNorm('pmsgs',d.data(),d.id),{pid:p.id,_k:key}));
   S.pmsgs=[...S.pmsgs.filter(m=>m._k!==key),...list];list.filter(m=>m.by==='client'&&!m.applied).forEach(m=>applyClientMsg(p,m,ref));scheduleRender()},()=>{});
  Store.unsubs.push(PORTAL_W[key]);
 });
}
function applyClientMsg(p,m,ref){
 const it=(p.shared||[]).find(x=>x.id===m.item);
 if(it&&(m.kind==='approve'||m.kind==='changes')&&it.status==='awaiting'){it.status=m.kind==='approve'?'approved':'changes';it.clientNote=m.text||'';it.decidedAt=m.at;
  if(m.kind==='changes'){p.revisions=p.revisions||[];p.revisions.push({id:uid(),date:String(m.at).slice(0,10),stage:it.stage,round:p.revisions.length+1,note:(it.title+': '+(m.text||'')).trim(),status:'open',by:'client'})}
  Store.put('projects',p);syncPortal(p)}
 addLog(p.id,'log_client_'+m.kind,{t:it?it.title:m.text},'globe');if(p.leadId)notify(p.leadId,'nt_client',{p:p.name,k:t('pk_'+m.kind)},'p-'+p.id,'client');
 ref.doc(m.id).update({applied:true}).catch(()=>{});
}
