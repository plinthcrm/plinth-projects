/* ---------- Firestore rules: pdt_* block, pasted inside the CRM rules file ---------- */
function pdtRules(){const P=FB_PREFIX,D='database';return `    // ===================== Plinth Projects (${P}*) — isolated from the CRM =====================
    function pdtSigned() { return request.auth != null; }
    function pdtHasU() { return pdtSigned() && exists(/databases/$(${D})/documents/${P}users/$(request.auth.uid)); }
    function pdtU() { return get(/databases/$(${D})/documents/${P}users/$(request.auth.uid)).data; }
    function pdtActive() { return pdtHasU() && pdtU().status == 'active'; }
    function pdtAdmin() { return pdtActive() && pdtU().admin == true; }
    function pdtCan(p) { return pdtAdmin() || (pdtActive() && p in pdtU().get('perms', [])); }
    function pdtFin() { return pdtCan('pay.view') || (pdtActive() && pdtU().get('finance', false) == true); }
    function pdtLead() { return pdtActive() && (pdtU().lead == true || pdtU().admin == true); }
    function pdtMe() { return pdtU().memberId; }
    function pdtOwner() { return pdtSigned() && request.auth.token.email == '${FB_OWNER}@${FB_AUTH_DOMAIN}'; }
    function pdtBooted() { return exists(/databases/$(${D})/documents/${P}meta/boot); }
    function pdtAff() { return request.resource.data.diff(resource.data).affectedKeys(); }
    function pdtOnly(keys) { return pdtAff().hasOnly(keys); }
    function pdtInviteOpen(tok) { return tok is string && exists(/databases/$(${D})/documents/${P}invites/$(tok)) && get(/databases/$(${D})/documents/${P}invites/$(tok)).data.status == 'open'; }
    function pdtRater(mid) { let m = get(/databases/$(${D})/documents/${P}team/$(mid)).data; return pdtAdmin() || m.get('seniorId', '') == pdtMe() || m.get('managerId', '') == pdtMe(); }

    match /${P}meta/{id} {
      allow get: if true;
      allow create: if id == 'boot' && pdtOwner() && !pdtBooted() && getAfter(/databases/$(${D})/documents/${P}users/$(request.auth.uid)).data.admin == true;
      allow list, update, delete: if false;
    }
    match /${P}users/{uid} {
      allow get: if pdtSigned() && (request.auth.uid == uid || pdtAdmin());
      allow list, delete: if pdtAdmin();
      allow create: if pdtAdmin()
        || (pdtOwner() && request.auth.uid == uid && !pdtBooted() && existsAfter(/databases/$(${D})/documents/${P}meta/boot))
        || (pdtSigned() && request.auth.uid == uid && request.resource.data.status == 'pending' && request.resource.data.keys().hasOnly(['status','applicant','invite']) && pdtInviteOpen(request.resource.data.invite));
      allow update: if pdtAdmin() || (pdtSigned() && request.auth.uid == uid && pdtOnly(['mustChange']) && request.resource.data.mustChange == false);
    }
    match /${P}invites/{tok} {
      allow get: if true;
      allow list, create, delete: if pdtCan('team.invite');
      allow update: if pdtCan('team.invite') || (pdtSigned() && resource.data.status == 'open' && request.resource.data.status == 'used' && pdtOnly(['status','usedAt']));
    }
    match /${P}applicants/{id} {
      allow create: if pdtSigned() && request.resource.data.status == 'pending' && request.resource.data.uid == request.auth.uid && pdtInviteOpen(request.resource.data.invite);
      allow read, update, delete: if pdtCan('team.invite');
    }
    match /${P}files/{id} {
      allow create: if pdtSigned() && request.resource.data.ownerUid == request.auth.uid && request.resource.data.scope in ['hr','work'] && request.resource.data.data is string && request.resource.data.data.size() < 1000000;
      allow get: if pdtAdmin() || resource.data.ownerUid == request.auth.uid || (pdtActive() && resource.data.scope == 'work');
      allow list, update: if false;
      allow delete: if pdtAdmin();
    }
    match /${P}team/{id}        { allow read: if pdtActive(); allow create, delete: if pdtAdmin();
      allow update: if pdtAdmin() || (pdtCan('team.manage') && !pdtAff().hasAny(['access','roleKey','permAdd','permDel','finance','uid','username','active'])); }
    match /${P}private/{id}     { allow read: if pdtCan('team.manage') || (pdtActive() && resource.data.memberId == pdtMe()); allow write: if pdtCan('team.manage'); }
    match /${P}cfg/{id}         { allow read: if pdtActive(); allow create, delete: if pdtAdmin(); allow update: if pdtAdmin() || (pdtCan('admin.org') && !pdtAff().hasAny(['roles'])) || (pdtCan('pay.rules') && pdtOnly(['pay','grace'])) || (pdtCan('kpi.manage') && pdtOnly(['kpiW'])) || (pdtCan('event.theme') && pdtOnly(['event'])); }
    match /${P}holidays/{id}    { allow read: if pdtActive(); allow create: if pdtCan('holiday.manage') || (pdtActive() && request.resource.data.get('approved', false) != true); allow update, delete: if pdtCan('holiday.manage'); }
    match /${P}comp/{id}        { allow read: if pdtFin(); allow write: if pdtCan('pay.run') || (pdtActive() && pdtU().get('finance', false) == true); }
    match /${P}slips/{id}       { allow read: if pdtFin() || (pdtActive() && resource.data.memberId == pdtMe() && resource.data.status == 'final'); allow write: if pdtCan('pay.run') || (pdtActive() && pdtU().get('finance', false) == true); }
    match /${P}attendance/{id} {
      allow read: if pdtCan('att.team') || pdtFin() || (pdtActive() && resource.data.memberId == pdtMe());
      allow create: if pdtAdmin() || (pdtActive() && request.resource.data.memberId == pdtMe() && id == pdtMe() + '_' + request.resource.data.date
        && request.resource.data.inSrv == request.time && !('outSrv' in request.resource.data));
      allow update: if pdtAdmin() || (pdtActive() && resource.data.memberId == pdtMe() && !('outSrv' in resource.data)
        && pdtOnly(['out','outSrv']) && request.resource.data.outSrv == request.time);
      allow delete: if pdtAdmin();
    }
    match /${P}time/{id} {
      allow read: if pdtActive();
      allow create: if pdtAdmin() || (pdtActive() && request.resource.data.memberId == pdtMe() && (
        (request.resource.data.get('manual', false) == true && request.resource.data.status == 'pending')
        || (request.resource.data.get('manual', false) != true && request.resource.data.startSrv == request.time)));
      allow update: if pdtAdmin()
        || (pdtActive() && resource.data.memberId == pdtMe() && pdtOnly(['end','endSrv'])
            && (!('endSrv' in pdtAff()) || request.resource.data.endSrv == request.time)
            && (request.resource.data.get('end', null) == null || 'endSrv' in request.resource.data || resource.data.get('manual', false) == true))
        || ((pdtCan('time.approve') || (pdtActive() && resource.data.get('reviewer', '') == pdtMe())) && pdtOnly(['status','decidedBy']));
      allow delete: if pdtAdmin();
    }
    match /${P}tasks/{id} {
      allow read, create: if pdtActive();
      allow update: if pdtActive()
        && (!('proofSrv' in pdtAff()) || request.resource.data.proofSrv == request.time)
        && (!('proof' in pdtAff()) || request.resource.data.get('proof', null) == null || 'proofSrv' in pdtAff() || pdtLead());
      allow delete: if pdtCan('task.manage') || pdtLead();
    }
    match /${P}projects/{id} {
      allow read, create: if pdtActive();
      allow update: if pdtActive() && (!('code' in pdtAff()) || pdtCan('proj.code')) && (!('portal' in pdtAff()) || pdtCan('proj.portal') || pdtLead());
      allow delete: if pdtCan('proj.delete');
    }
    match /${P}hr/{id} {
      allow read: if pdtCan('hr.approve') || pdtFin() || (pdtActive() && (resource.data.memberId == pdtMe() || resource.data.get('seniorId', '') == pdtMe()));
      allow create: if pdtAdmin() || (pdtActive() && request.resource.data.memberId == pdtMe() && request.resource.data.status == 'pending');
      allow update: if pdtCan('hr.approve') || (pdtActive() && resource.data.get('seniorId', '') == pdtMe() && resource.data.get('step', '') == 'senior' && resource.data.memberId != pdtMe()
        && request.resource.data.status in ['pending','rejected'] && pdtOnly(['step','seniorOk','status','note','decidedBy','decidedAt']));
      allow delete: if pdtAdmin();
    }
    match /${P}changes/{id} {
      allow read: if pdtCan('team.manage') || (pdtActive() && resource.data.memberId == pdtMe());
      allow create: if pdtActive() && request.resource.data.memberId == pdtMe() && request.resource.data.status == 'pending';
      allow update, delete: if pdtCan('team.manage');
    }
    match /${P}down/{id} {
      allow read: if pdtAdmin() || (pdtActive() && resource.data.memberId == pdtMe());
      allow create, update: if pdtAdmin() || (pdtActive() && request.resource.data.memberId == pdtMe());
      allow delete: if pdtAdmin();
    }
    match /${P}ratings/{id} {
      allow read: if pdtCan('kpi.viewAll') || (pdtActive() && (resource.data.memberId == pdtMe() || resource.data.by == pdtMe()));
      allow write: if pdtActive() && request.resource.data.by == pdtMe() && request.resource.data.memberId != pdtMe() && pdtRater(request.resource.data.memberId);
    }
    match /${P}notifs/{id} {
      allow read: if pdtActive() && resource.data.to == pdtMe();
      allow update: if pdtActive() && resource.data.to == pdtMe() && pdtOnly(['read']);
      allow create: if pdtActive() && (request.resource.data.get('from', '') == pdtMe() || request.resource.data.to == pdtMe());
      allow delete: if pdtAdmin() || (pdtActive() && resource.data.to == pdtMe());
    }
    match /${P}chat/{id} {
      allow read: if pdtActive() && (resource.data.pub == true || pdtMe() in resource.data.members);
      allow create: if pdtActive() && request.resource.data.from == pdtMe() && (request.resource.data.pub == true || pdtMe() in request.resource.data.members);
      allow update: if pdtActive() && (resource.data.pub == true || pdtMe() in resource.data.members) && pdtOnly(['react']);
      allow delete: if pdtAdmin() || (pdtActive() && resource.data.from == pdtMe());
    }
    match /${P}logs/{id}        { allow read, create: if pdtActive(); allow update, delete: if pdtAdmin(); }
    match /${P}memos/{id}       { allow read: if pdtActive(); allow create, delete: if pdtCan('memo.post'); allow update: if pdtCan('memo.post') || (pdtActive() && pdtOnly(['acks'])); }
    match /${P}buzz/{id}        { allow read: if pdtActive(); allow create: if pdtActive() && request.resource.data.get('golden', false) != true || pdtCan('buzz.golden'); allow update: if pdtAdmin() || (pdtActive() && pdtOnly(['cheers','seen','wishes'])); allow delete: if pdtAdmin(); }
    match /${P}stories/{id}     { allow read: if pdtActive(); allow write: if pdtCan('proj.stories') || pdtLead(); }
    match /${P}portals/{key} {
      allow get: if true;
      allow list: if false;
      allow write: if pdtCan('proj.portal') || pdtLead();
      match /msgs/{mid} {
        allow read: if true;
        allow create: if pdtActive() || (request.resource.data.by == 'client' && request.resource.data.keys().hasOnly(['id','pid','by','kind','item','text','at'])
          && request.resource.data.kind in ['approve','changes','request','question','meeting'] && request.resource.data.text is string && request.resource.data.text.size() < 3000);
        allow update, delete: if pdtCan('proj.portal') || pdtLead();
      }
    }
    match /${P}audit/{id} {
      allow read: if pdtCan('admin.security');
      allow create: if pdtActive() && request.resource.data.by == pdtMe();
      allow update, delete: if false;
    }
    // ===================== end Plinth Projects =====================`}

${pdtRules()}

function ROLES(){
 const c=CFG().roles||{},out={};
 Object.entries(BASE_ROLES).forEach(([k,r])=>{out[k]=Object.assign({},r,c[k]||{},{key:k,builtin:true});if(k==='admin'){out[k].perms=ALL_PERMS;out[k].base='admin'}});
 Object.entries(c).forEach(([k,r])=>{if(!out[k]&&r&&!r.deleted)out[k]=Object.assign({base:'engineer',perms:[]},r,{key:k})});
 return out;
}
const roleName=r=>!r?'—':(prefs.lang==='ar'?(r.nameAr||r.nameEn):(r.nameEn||r.nameAr))||t('a_'+r.key);
function roleOf(m){const R=ROLES();return (m&&m.roleKey&&R[m.roleKey])||(m&&R[m.access])||R.engineer}
function hasPerm(m,p){
 if(!m||m.active===false)return false;const r=roleOf(m);if(r.key==='admin')return true;
 if((m.permDel||[]).includes(p))return false;if((m.permAdd||[]).includes(p))return true;

}

const adminCount=()=>S.team.filter(x=>x.active!==false&&roleOf(x).key==='admin').length;
function setRole(m,k,silent){
 if(!isOwnerAdmin()){toast(t('noPerm'));return false}
 const R=ROLES(),was=roleOf(m).key;if(!R[k]||was===k)return false;
 if(was==='admin'&&adminCount()<=1){toast(t('lastAdmin'));return false}
 if(m.id===prefs.me&&was==='admin'){toast(t('selfDemote'));return false}
 Object.assign(m,roleFields(k));saveMember(m,'role',`${was} → ${k}`);if(!silent)toast(t('saved'));return true;
}
function setActive(m,on){
 if(!isOwnerAdmin()&&!P('team.manage')){toast(t('noPerm'));return false}
 if(m.id===prefs.me&&!on){toast(t('selfDisable'));return false}
 if(!on&&roleOf(m).key==='admin'&&adminCount()<=1){toast(t('lastAdmin'));return false}
 m.active=!!on;saveMember(m,on?'enable':'disable');return true;
}
