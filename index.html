<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060807">
<title>Plinth Projects — متابعة المشروعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060807;--solid:#111413;--solid2:#171B19;
  --surface:rgba(255,255,255,.035);--surface2:rgba(255,255,255,.065);
  --ink:#ECEFED;--ink2:#C3C9C6;--muted:#7D8682;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.05);
  --accent:#38E07B;--accent2:#14A650;--accent-ink:#03140A;--accent-soft:rgba(56,224,123,.11);
  --gold:#D8B878;--gold-soft:rgba(216,184,120,.14);
  --ok:#38E07B;--ok-soft:rgba(56,224,123,.12);--risk:#F4B64A;--risk-soft:rgba(244,182,74,.13);--late:#FF6A5C;--late-soft:rgba(255,106,92,.13);--hold:#8E98A6;--hold-soft:rgba(142,152,166,.14);--done:#8DB1FF;--done-soft:rgba(141,177,255,.13);
  --shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 50px rgba(0,0,0,.42);--shadow-lg:0 30px 80px rgba(0,0,0,.6);
  --glow:0 0 0 1px rgba(56,224,123,.55),0 0 28px rgba(56,224,123,.35);
  --r:20px;--r-sm:12px;--side:236px;--top:64px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --dot:rgba(255,255,255,.055);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#EDF0EE;--solid:#FFFFFF;--solid2:#F6F8F7;
  --surface:rgba(255,255,255,.62);--surface2:rgba(255,255,255,.9);
  --ink:#0D1110;--ink2:#2E3532;--muted:#6A736F;--line:rgba(10,20,15,.09);--line2:rgba(10,20,15,.055);
  --accent:#12A150;--accent2:#0B7A3B;--accent-ink:#FFFFFF;--accent-soft:rgba(18,161,80,.1);
  --gold:#A67C35;--gold-soft:rgba(166,124,53,.12);
  --ok:#12A150;--ok-soft:rgba(18,161,80,.1);--risk:#B97A0E;--risk-soft:rgba(185,122,14,.11);--late:#D2443A;--late-soft:rgba(210,68,58,.1);--hold:#6C7584;--hold-soft:rgba(108,117,132,.12);--done:#3F6FD1;--done-soft:rgba(63,111,209,.1);
  --shadow:inset 0 1px 0 rgba(255,255,255,.8),0 12px 36px rgba(15,30,22,.08);--shadow-lg:0 30px 80px rgba(15,30,22,.2);
  --glow:0 0 0 1px rgba(18,161,80,.5),0 0 24px rgba(18,161,80,.2);
  --dot:rgba(10,20,15,.07);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Outfit","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 78% -12%,rgba(56,224,123,.075),transparent 62%),radial-gradient(900px 520px at -5% 105%,rgba(216,184,120,.055),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at 60% 30%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at 60% 30%,#000 25%,transparent 80%)}
[lang="ar"] body{font-family:"IBM Plex Sans Arabic","Outfit",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.thin{font-weight:300;letter-spacing:-.02em}
::selection{background:var(--accent);color:var(--accent-ink)}
*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}*::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.side{position:fixed;inset-block:12px;inset-inline-start:12px;width:calc(var(--side) - 12px);background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);display:flex;flex-direction:column;padding:16px 12px;z-index:30;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:radial-gradient(circle at 30% 25%,#7DF5AD,var(--accent) 45%,var(--accent2));color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.5px;box-shadow:0 0 22px rgba(56,224,123,.35),inset 0 1px 0 rgba(255,255,255,.5);flex:none}
.brand-t{font-weight:600;font-size:14.5px;line-height:1.15}
.brand-s{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:500;border:1px solid transparent;transition:background .15s,border-color .15s}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(56,224,123,.22)}
.nav .badge{margin-inline-start:auto}
.nav-sep{height:1px;background:var(--line);margin:12px 6px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid var(--line)}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11.5px;color:var(--muted)}
.main{flex:1;margin-inline-start:var(--side);min-width:0}
.top{position:sticky;top:0;z-index:20;height:calc(var(--top) + var(--safe-t));padding-top:var(--safe-t);display:flex;align-items:center;gap:10px;padding-inline:24px;background:linear-gradient(180deg,var(--bg) 30%,transparent)}
.top h1{font-size:19px;margin:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.top .sp{flex:1}
.tgroup{display:flex;align-items:center;gap:2px;padding:3px;border-radius:14px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.search-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;color:var(--muted);min-width:250px}
.search-btn:hover{color:var(--ink)}
.search-btn kbd{margin-inline-start:auto;font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.new-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface2),var(--surface));font-weight:500;backdrop-filter:blur(16px)}
.new-btn:hover{border-color:rgba(56,224,123,.45);box-shadow:0 0 18px rgba(56,224,123,.15)}
.view{padding:8px 24px 110px;max-width:1500px;margin:0 auto}
.bnav{display:none}
.fab{position:fixed;inset-inline-end:24px;bottom:calc(24px + var(--safe-b));width:56px;height:56px;border-radius:18px;background:radial-gradient(circle at 30% 25%,#7DF5AD,var(--accent) 50%,var(--accent2));color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 30px rgba(56,224,123,.4),0 12px 30px rgba(0,0,0,.4);z-index:25}
.fab svg.i{width:24px;height:24px;stroke-width:2.2}

/* ---------- primitives ---------- */
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{margin:0;font-size:14.5px;font-weight:500}
.card-h .sp{flex:1}
.card-b{padding:15px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-weight:500;border:1px solid var(--line);background:var(--surface2);white-space:nowrap;transition:border-color .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:linear-gradient(180deg,#5BF09A,var(--accent) 55%,var(--accent2));color:var(--accent-ink);border-color:transparent;box-shadow:0 0 22px rgba(56,224,123,.28)}
[data-theme="light"] .btn.acc{background:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--late)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.h-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.h-risk{background:var(--risk-soft);color:var(--risk);border-color:transparent}
.h-late{background:var(--late-soft);color:var(--late);border-color:transparent}
.h-hold{background:var(--hold-soft);color:var(--hold);border-color:transparent}
.h-done{background:var(--done-soft);color:var(--done);border-color:transparent}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--late);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;flex:none;letter-spacing:-.3px;border:2px solid var(--solid)}
.av svg.i{width:60%;height:60%}
.avs{display:inline-flex}
.avs .av+.av{margin-inline-start:-8px}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px rgba(56,224,123,.4)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty svg.i{width:34px;height:34px;opacity:.5;margin-bottom:6px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;backdrop-filter:blur(12px)}
.seg button{height:32px;padding:0 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px var(--line)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.inp,.sel{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px;outline:none;min-width:0;backdrop-filter:blur(12px)}
.sel option{background:var(--solid);color:var(--ink)}
.inp:focus,.sel:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-ic{position:relative;display:flex;align-items:center}
.inp-ic svg.i{position:absolute;inset-inline-start:12px;color:var(--muted);pointer-events:none}
.inp-ic .inp{padding-inline-start:38px;width:100%}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(216,184,120,.2);border-radius:14px;padding:8px 14px;margin-bottom:16px;font-weight:500;font-size:13px}
.demo-bar .sp{flex:1}
h2.sec{font-size:15px;margin:28px 0 12px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none}

/* ---------- ORBIT (home hero) ---------- */
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:4px 0 16px}
.hello h2{margin:0;font-size:26px;font-weight:300;letter-spacing:-.02em}
.hello p{margin:2px 0 0;color:var(--muted)}
.orbit{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:stretch}
.orb-stage{position:relative;height:620px;overflow:hidden;padding:0}
.orb-stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 18% 50%,rgba(56,224,123,.06),transparent 70%)}
.orb-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.orb-svg path{fill:none;stroke-linecap:round}
.orb-svg .l-core{stroke:url(#gGold);stroke-width:1.2;opacity:.75}
.orb-svg .l-fan{stroke:url(#gFan);stroke-width:1;opacity:.55;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.orb-svg .l-fan.on{stroke:var(--accent);opacity:1;stroke-width:1.6;filter:drop-shadow(0 0 4px rgba(56,224,123,.8))}
@keyframes draw{to{stroke-dashoffset:0}}
.orb-core{position:absolute;inset-inline-start:2%;top:50%;transform:translateY(-50%);width:330px;height:330px;z-index:2}
.orb-core::before{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(56,224,123,.04) 40%,transparent 68%)}
.orb-core::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--line2)}
.orb-core canvas{position:absolute;inset:0;width:100%;height:100%}
.orb-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.orb-label .big{font-size:46px;font-weight:200;line-height:1;letter-spacing:-.03em;text-shadow:0 0 30px rgba(0,0,0,.8)}
.orb-label .lab{font-size:11.5px;color:var(--ink2);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;text-shadow:0 0 12px #000}
[lang="ar"] .orb-label .lab{letter-spacing:0}
.orb-label .chip{margin-top:10px;backdrop-filter:blur(8px)}
.orb-hubs{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:calc(2% + 360px);display:flex;flex-direction:column;gap:12px;z-index:3}
.hub{width:162px;padding:10px 13px;border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);display:flex;flex-direction:column;text-align:start;backdrop-filter:blur(14px);transition:border-color .2s,box-shadow .2s,transform .2s}
[data-theme="light"] .hub{background:rgba(255,255,255,.75)}
.hub:hover{transform:translateX(3px)}
.hub .v{font-size:22px;font-weight:300;line-height:1.1;display:flex;align-items:center;gap:8px}
.hub .v svg.i{width:15px;height:15px;color:var(--muted)}
.hub .k{font-size:11.5px;color:var(--muted)}
.hub.on{border-color:rgba(216,184,120,.7);box-shadow:0 0 0 1px rgba(216,184,120,.35),0 0 26px rgba(216,184,120,.18);background:linear-gradient(180deg,rgba(216,184,120,.16),rgba(216,184,120,.04))}
.orb-nodes{position:absolute;inset:0;z-index:3;pointer-events:none}
.node{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:9px;transform:translateY(-50%);text-align:start;opacity:0;animation:nodeIn .5s ease forwards;max-width:230px}
@keyframes nodeIn{to{opacity:var(--o,1)}}
.node .pt{width:10px;height:10px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 55%,#7a6230);box-shadow:0 0 10px rgba(216,184,120,.7)}
.node .tx{min-width:0}
.node .nm{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.node .sb{display:flex;align-items:center;gap:4px;margin-top:2px}
.node .mini{height:15px;padding:0 5px;border-radius:4px;font-size:10px;font-weight:500;display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.node .pips{display:inline-flex;gap:2px}
.node .pips i{width:5px;height:8px;border-radius:1.5px;background:var(--line)}
.node .pips i.f{background:var(--accent)}
.node.on .pt{background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 55%,var(--accent2));box-shadow:0 0 0 4px rgba(56,224,123,.18),0 0 14px rgba(56,224,123,.9)}
.node.on .nm{color:var(--accent)}
.node:hover .nm{color:var(--accent)}
.node.more{opacity:.6}
.orb-panel{display:flex;flex-direction:column;overflow:hidden}
.op-sec{padding:16px 18px;border-bottom:1px solid var(--line2)}
.op-sec:last-child{border-bottom:0}
.op-cat{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:13px;font-weight:500}
.op-cat svg.i{width:20px;height:20px}
.op-name{font-size:24px;font-weight:300;letter-spacing:-.02em;line-height:1.2;margin:10px 0 2px}
.op-box{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:12px}
.op-box .t{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.4}
.prate{border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;border:1px solid var(--line)}
.prate.ok{background:linear-gradient(135deg,rgba(56,224,123,.16),rgba(56,224,123,.02) 70%)}
.prate.risk{background:linear-gradient(135deg,rgba(244,182,74,.18),rgba(244,182,74,.02) 70%)}
.prate.late{background:linear-gradient(135deg,rgba(255,106,92,.2),rgba(255,106,92,.02) 70%)}
.prate.hold,.prate.done{background:linear-gradient(135deg,rgba(141,177,255,.14),rgba(141,177,255,.02) 70%)}
.prate .bigp{font-size:46px;font-weight:200;line-height:1;letter-spacing:-.03em}
.prate .delta{font-size:12px;font-weight:500}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px;flex:1;min-width:0}
.spark i{flex:1;min-width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.25));opacity:.85}
[data-theme="light"] .spark i{background:linear-gradient(180deg,var(--ink),rgba(0,0,0,.2))}
.spark i.z{background:var(--line);opacity:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:3px;text-align:start}
.tile .v{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:300;line-height:1.1}
.tile .v svg.i{width:20px;height:20px;color:var(--ink2);stroke-width:1.4}
.tile .k{font-size:12px;color:var(--muted)}
.insight{font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:8px;text-align:start;width:100%;display:block}
.insight b{display:block;font-weight:500;font-size:13px;color:var(--ink)}
.insight span{color:var(--muted)}
.ask{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(225,230,228,.9));color:#0D1110;box-shadow:0 10px 30px rgba(0,0,0,.35)}
[dir="rtl"] .ask{padding:6px 16px 6px 6px}
.ask input{flex:1;border:0;outline:none;background:none;color:#0D1110;height:36px;min-width:0}
.ask input::placeholder{color:#6A736F}
.ask button{width:36px;height:36px;border-radius:11px;background:#0D1110;color:#fff;display:grid;place-items:center}
.ask-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.pl{padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:start}
.pl:hover{border-color:var(--muted)}
.pl .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none}
.pl .v{font-size:26px;font-weight:300;line-height:1.05;letter-spacing:-.02em}
.pl .k{font-size:12px;color:var(--muted)}
.pl.t-late .v{color:var(--late)}.pl.t-risk .v{color:var(--risk)}.pl.t-ok .v{color:var(--ok)}
.dash-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.alert{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:flex-start;width:100%;text-align:start;transition:background .15s}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--surface2)}
.alert .ai{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;margin-top:1px}
.alert .ai svg.i{width:16px;height:16px}
.sev-crit .ai{background:var(--late-soft);color:var(--late)}
.sev-warn .ai{background:var(--risk-soft);color:var(--risk)}
.sev-info .ai{background:var(--done-soft);color:var(--done)}
.alert b{font-weight:500;display:block;font-size:13.5px}
.alert span{font-size:12.5px;color:var(--muted)}
.up{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line2);width:100%;text-align:start}
.up:last-child{border-bottom:0}
.up:hover{background:var(--surface2)}
.up .dd{width:46px;text-align:center;flex:none;border-radius:11px;background:var(--surface);border:1px solid var(--line);padding:4px 0;line-height:1.15}
.up .dd b{display:block;font-size:17px;font-weight:400}
.up .dd span{font-size:10.5px;color:var(--muted)}
.team-now{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tn{padding:15px;display:flex;flex-direction:column;gap:11px;text-align:start}
.tn:hover{border-color:var(--muted)}
.tn .doing{font-size:12.5px;background:var(--surface);border-radius:11px;padding:8px 10px;border:1px solid var(--line2)}
.tn .doing b{font-weight:500}
.stagebars{display:flex;flex-direction:column;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 28px;gap:12px;align-items:center;font-size:13px}
.sb .bar{height:8px}
.sb .bar>i{box-shadow:none}

/* ---------- DECK (projects) ---------- */
.deck-wrap{position:relative;height:500px;overflow:hidden;padding:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.deck{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 38%;direction:ltr;transition:transform .65s cubic-bezier(.2,.75,.2,1)}
.fold{position:absolute;left:50%;top:56%;width:210px;height:280px;margin:-140px 0 0 -105px;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.2,1),opacity .45s,filter .45s;cursor:pointer;will-change:transform}
.fold .tab{position:absolute;top:-15px;left:16px;width:92px;height:26px;border-radius:11px 11px 0 0;background:linear-gradient(180deg,rgba(250,251,250,.96),rgba(225,229,227,.9))}
.fold .body{position:absolute;inset:0;border-radius:4px 18px 18px 18px;background:linear-gradient(165deg,rgba(250,251,250,.96),rgba(206,212,209,.82) 48%,rgba(150,157,153,.62));border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 #fff,inset 0 -30px 50px rgba(0,0,0,.08),0 30px 60px rgba(0,0,0,.5);overflow:hidden;color:#121615;padding:16px 16px 14px;display:flex;flex-direction:column}
.fold .sheet{position:absolute;top:18px;left:22px;right:22px;height:118px;border-radius:10px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);padding:12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.fold .sheet i{display:block;height:7px;border-radius:4px;background:rgba(0,0,0,.12)}
.fold .sheet i:nth-child(2){width:72%}.fold .sheet i:nth-child(3){width:86%}.fold .sheet i:nth-child(4){width:55%}
.fold .sheet b{position:absolute;inset-inline-end:10px;bottom:10px;font-size:10px;font-weight:600;color:rgba(0,0,0,.45);direction:ltr}
.fold .lower{margin-top:auto;position:relative;z-index:1}
.fold .meta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.fold .meta svg.i{width:16px;height:16px;stroke-width:2.2}
.fold .nm{font-size:17px;font-weight:500;line-height:1.2;margin-top:6px;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fold .cd{font-size:10.5px;color:rgba(0,0,0,.5);margin-top:3px;direction:ltr;text-align:start}
.fold .hd{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;z-index:2;box-shadow:0 0 8px currentColor;background:currentColor}
.fold.sel .tab{background:linear-gradient(180deg,#6CF3A5,#3EDB80)}
.fold.sel .body{background:linear-gradient(165deg,#6CF3A5,#2FD172 38%,#119A4B 100%);color:#fff;border-color:rgba(190,255,215,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 60px rgba(56,224,123,.55),0 30px 70px rgba(0,0,0,.55)}
.fold.sel .sheet{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45)}
.fold.sel .sheet i{background:rgba(255,255,255,.45)}
.fold.sel .sheet b,.fold.sel .cd{color:rgba(255,255,255,.75)}
.fold.far{pointer-events:none}
.deck-arc{position:absolute;top:18px;left:6%;right:6%;height:110px;pointer-events:none;z-index:5}
.deck-arc path{fill:none;stroke:rgba(56,224,123,.5);stroke-width:1.2}
.deck-handle{position:absolute;z-index:6;width:46px;height:28px;margin:-14px 0 0 -23px;border-radius:99px;border:1px solid rgba(56,224,123,.7);background:rgba(10,30,18,.6);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;box-shadow:0 0 18px rgba(56,224,123,.4);transition:left .6s cubic-bezier(.2,.75,.2,1),top .6s cubic-bezier(.2,.75,.2,1);backdrop-filter:blur(6px)}
[data-theme="light"] .deck-handle{background:rgba(255,255,255,.8)}
.deck-handle svg.i{width:13px;height:13px;stroke-width:2.2}
.deck-nav{position:absolute;bottom:16px;z-index:7;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);backdrop-filter:blur(10px)}
.deck-nav:hover{border-color:var(--accent);color:var(--accent)}
.deck-nav.prev{left:18px}.deck-nav.next{right:18px}
.deck-count{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);z-index:7;direction:ltr}
.fcard{position:absolute;z-index:8;left:50%;top:56%;width:240px;transform:translate(-112%,-128%);transition:opacity .3s,margin-left .65s cubic-bezier(.2,.75,.2,1)!important;padding:16px 18px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(226,231,229,.82));color:#0E1211;border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 #fff;overflow:hidden;backdrop-filter:blur(14px);pointer-events:auto;cursor:pointer;transition:opacity .3s,transform .5s cubic-bezier(.2,.75,.2,1);direction:ltr}
.fcard::after{content:"";position:absolute;width:190px;height:150px;right:-50px;bottom:-60px;border-radius:50%;background:radial-gradient(circle,rgba(56,224,123,.95),rgba(56,224,123,.35) 45%,transparent 70%);filter:blur(10px)}
.fcard .t{font-size:18px;font-weight:500;line-height:1.2;position:relative;z-index:1;padding-right:20px}
.fcard .d{font-size:13px;color:rgba(0,0,0,.45);position:relative;z-index:1}
.fcard .p{font-size:46px;font-weight:200;line-height:1;margin-top:16px;position:relative;z-index:1;letter-spacing:-.03em}
.fcard .p small{font-size:24px;color:rgba(0,0,0,.45)}
.fcard .arr{position:absolute;top:16px;right:16px;z-index:1}
.fcard .pin{position:absolute;right:22px;bottom:24px;width:26px;height:26px;border-radius:50%;background:#7DF5AD;z-index:2;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(125,245,173,.35)}
.fcard .pin::after{content:"";width:8px;height:8px;border-radius:50%;background:#0D1110}
.fcard.swap{opacity:0}
.deck-below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-top:16px;align-items:start}
.kd-row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line2);font-size:13px}
.kd-row:last-child{border-bottom:0}
.kd-row .dt b{display:block;font-weight:500}
.kd-row .dt span{font-size:11.5px;color:var(--muted)}
.gpanel{position:relative;border-radius:22px;padding:56px 20px 18px;color:#fff;overflow:visible;margin-top:44px;
  background:linear-gradient(160deg,rgba(80,235,150,.75),rgba(30,170,90,.72) 45%,rgba(10,110,55,.78));border:1px solid rgba(170,255,205,.45);box-shadow:0 0 50px rgba(56,224,123,.2),0 30px 60px rgba(0,0,0,.4);backdrop-filter:blur(18px)}
.gpanel .fan{position:absolute;top:-40px;inset-inline-end:22px;display:flex;direction:ltr}
.gpanel .fan div{width:120px;height:78px;border-radius:12px;padding:9px 11px;font-size:10.5px;color:rgba(255,255,255,.9);background:linear-gradient(170deg,rgba(255,255,255,.32),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);margin-left:-26px;transform-origin:bottom center;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.gpanel .fan div:nth-child(1){transform:rotate(-8deg) translateY(6px)}.gpanel .fan div:nth-child(2){transform:rotate(-2deg)}.gpanel .fan div:nth-child(3){transform:rotate(5deg) translateY(4px)}
.gpanel .fan b{display:block;font-size:11.5px;font-weight:600;margin-top:2px}
.gpanel h4{margin:0;font-size:21px;font-weight:400;letter-spacing:-.01em}
.gpanel .sub{font-size:12.5px;color:rgba(255,255,255,.75)}
.track{position:relative;height:2px;background:rgba(255,255,255,.35);border-radius:2px;margin:26px 0 8px}
.track i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.track b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
[dir="rtl"] .track i{left:auto;right:0}
.gp-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);margin-top:8px;font-size:13px;text-align:start;width:100%;color:#fff}
.gp-row:hover{background:rgba(255,255,255,.22)}
.gp-row .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.gp-row .ic svg.i{width:15px;height:15px}
.gp-row span.s{color:rgba(255,255,255,.7);font-size:11.5px;display:block}

/* ---------- projects grid / board / table ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{padding:17px;display:flex;flex-direction:column;gap:12px;text-align:start;transition:border-color .15s,transform .2s}
.pc:hover{border-color:rgba(56,224,123,.4);transform:translateY(-2px)}
.pc .code{font-size:11.5px;color:var(--muted);font-weight:500}
.pc h4{margin:0;font-size:16px;font-weight:500;line-height:1.3}
.pc .meta{display:flex;flex-wrap:wrap;gap:6px}
.pc .foot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px}
.prog .bar{flex:1}
.stg-line{display:flex;gap:3px}
.stg-line i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.stg-line i.d{background:var(--accent);box-shadow:0 0 6px rgba(56,224,123,.5)}
.stg-line i.a{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 3px,rgba(56,224,123,.35) 3px,rgba(56,224,123,.35) 6px)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;align-items:flex-start}
.col{flex:0 0 284px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 200px);scroll-snap-align:start;backdrop-filter:blur(14px)}
.col-h{display:flex;align-items:center;gap:8px;padding:13px 15px;font-weight:500;font-size:13.5px}
.col-h .cnt{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.col-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.col.over{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow)}
.kc{background:var(--solid2);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;text-align:start;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;transition:border-color .15s}
.kc:hover{border-color:rgba(56,224,123,.45)}
.kc.dragging{opacity:.4}
.kc .t{font-weight:500;font-size:13.5px;line-height:1.35}
.kc .s{font-size:12px;color:var(--muted)}
.kc .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pdot-high{background:var(--late);box-shadow:0 0 6px var(--late)}.pdot-med{background:var(--risk)}.pdot-low{background:var(--hold)}
.due{font-size:11.5px;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.due svg.i{width:13px;height:13px}
.due.over{color:var(--late);font-weight:600}
.due.soon{color:var(--risk);font-weight:600}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:start;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--surface2)}
.tbl tr:last-child td{border-bottom:0}

/* ---------- project detail ---------- */
.pd-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.pd-head h2{margin:4px 0 6px;font-size:30px;font-weight:300;line-height:1.2;letter-spacing:-.02em}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:10px}
.back:hover{color:var(--ink)}
[dir="rtl"] .flip{transform:scaleX(-1)}
.pd-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.stepper{display:flex;gap:7px;overflow-x:auto;padding:15px 18px;scrollbar-width:thin}
.step{flex:1 0 112px;display:flex;flex-direction:column;gap:6px;padding:11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;min-width:112px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--line);color:var(--muted)}
.step .n svg.i{width:12px;height:12px;stroke-width:3}
.step .l{font-size:12.5px;font-weight:500;line-height:1.3}
.step .d{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.step .d svg.i{width:11px;height:11px}
.step.done .n{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 10px rgba(56,224,123,.5)}
.step.active{border-color:rgba(56,224,123,.6);background:linear-gradient(160deg,rgba(56,224,123,.18),rgba(56,224,123,.04));box-shadow:var(--glow)}
.step.active .n{background:var(--ink);color:var(--bg)}
.step.late .d{color:var(--late);font-weight:600}
.gate{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:15px 18px;border-top:1px solid var(--line2);background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.gate .info{flex:1;min-width:220px}
.gate .info b{display:block;font-size:15px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs .cnt{font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.tli:last-child{border-bottom:0}
.tli .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;color:var(--muted)}
.tli .ic svg.i{width:14px;height:14px}
.trow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.trow:hover{background:var(--surface2)}
.trow:last-child{border-bottom:0}
.chk{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.chk svg.i{width:13px;height:13px;stroke-width:3}
.trow.isdone .tt{text-decoration:line-through;color:var(--muted)}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:300}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:end;font-weight:500}
.stage-group{font-size:12px;font-weight:500;color:var(--muted);padding:10px 18px 7px;background:var(--surface);border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:center}

/* ---------- team ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tm{padding:17px;display:flex;flex-direction:column;gap:12px;text-align:start;transition:border-color .15s}
.tm:hover{border-color:rgba(56,224,123,.4)}
.tm .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm .stats div{background:var(--surface);border-radius:11px;padding:8px 10px;border:1px solid var(--line2)}
.tm .stats b{display:block;font-size:19px;line-height:1.2;font-weight:300}
.tm .stats span{font-size:11.5px;color:var(--muted)}
.load-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.lvl-ok>i{background:var(--ok)}.lvl-hi>i{background:var(--risk);box-shadow:0 0 8px var(--risk)}.lvl-over>i{background:var(--late);box-shadow:0 0 8px var(--late)}.lvl-lo>i{background:var(--done);box-shadow:none}
.tm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tm li{font-size:12.5px;display:flex;gap:7px;align-items:center}

/* ---------- gantt ---------- */
.gantt{overflow:auto;direction:ltr;position:relative;max-height:calc(100vh - 200px)}
.g-in{position:relative}
.g-head{position:sticky;top:0;z-index:3;display:flex;background:var(--solid);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:4;background:var(--solid);border-right:1px solid var(--line);flex:none}
.g-scale{position:relative;height:48px}
.g-m{position:absolute;top:0;height:24px;font-size:11.5px;font-weight:500;padding:5px 8px;border-left:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
.g-w{position:absolute;top:24px;height:24px;font-size:10.5px;color:var(--muted);padding:4px 4px;border-left:1px solid var(--line2);white-space:nowrap}
.g-row{display:flex;border-bottom:1px solid var(--line2);height:54px}
.g-row:hover{background:var(--surface)}
.g-lab{position:sticky;left:0;z-index:2;background:var(--solid);border-right:1px solid var(--line);flex:none;padding:7px 12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden}
.g-lab b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;flex:none}
.g-seg{position:absolute;top:16px;height:22px;border-radius:6px;font-size:10.5px;font-weight:500;color:rgba(0,0,0,.78);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;direction:rtl}
[lang="en"] .g-seg{direction:ltr}
.g-seg.pend{opacity:.3}
.g-seg.act{box-shadow:0 0 0 2px var(--solid),0 0 0 3.5px var(--accent),0 0 16px rgba(56,224,123,.5)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1;pointer-events:none;box-shadow:0 0 10px var(--accent)}
.g-today::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.g-due{position:absolute;top:12px;width:2px;height:30px;background:var(--gold);border-radius:2px;box-shadow:0 0 6px var(--gold)}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* ---------- modal / sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(3,5,4,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.modal{background:var(--solid);border:1px solid var(--line);border-radius:22px;width:100%;max-width:620px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .2s ease}
.modal.wide{max-width:820px}
.modal.narrow{max-width:420px}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-h h3{margin:0;font-size:16.5px;font-weight:500;flex:1}
.m-b{padding:18px 20px;overflow-y:auto}
.m-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);padding-bottom:calc(14px + var(--safe-b))}
.m-f .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:500;color:var(--ink2)}
.fld .inp,.fld .sel{width:100%;height:42px}
.fld textarea{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:10px 12px;min-height:84px;resize:vertical;outline:none}
.fld .hint{font-size:11.5px;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink)}
[dir="rtl"] .pick label{padding:4px 4px 4px 10px}
.pick input{display:none}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toast-wrap{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:var(--shadow-lg);animation:pop .2s ease;font-size:13.5px}
.menu{position:fixed;z-index:80;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:5px;min-width:200px;animation:pop .12s ease}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:9px;text-align:start;font-size:13.5px}
.menu button:hover{background:var(--surface2)}
.srch{align-items:flex-start;padding-top:10vh}
.srch .modal{max-width:620px}
.srch-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.srch-in input{flex:1;border:0;outline:none;background:none;font-size:16px}
.sr{display:flex;align-items:center;gap:11px;padding:10px 18px;width:100%;text-align:start}
.sr:hover,.sr.sel{background:var(--surface2)}
.sr-g{font-size:11.5px;color:var(--muted);font-weight:500;padding:10px 18px 4px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}}
.set-sec{margin-bottom:16px}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .l{flex:1;min-width:200px}
.set-row .l b{display:block;font-weight:500;font-size:13.5px}
.set-row .l span{font-size:12.5px;color:var(--muted)}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;width:100%;min-height:120px;outline:none}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--hold)}
.status-dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.login{max-width:380px;margin:12vh auto;padding:28px}

/* ---------- responsive ---------- */
@media (max-width:1560px){.orbit{grid-template-columns:minmax(0,1fr) 340px}.orb-core{width:270px;height:270px}.orb-hubs{inset-inline-start:calc(2% + 285px)}.hub{width:138px}.node{max-width:205px}}
@media (max-width:1180px){
  :root{--side:84px}
  .side{padding:14px 10px;align-items:center}
  .brand{padding:2px 0 16px}.brand-t,.brand-s,.nav a span,.side-foot .who,.nav .badge{display:none}
  .nav a{justify-content:center;padding:11px;position:relative}
  .nav a .badge{display:inline-grid;position:absolute;top:2px;inset-inline-end:2px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .side-foot{padding:10px 0 0;justify-content:center}
  .pd-grid{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
  .search-btn{min-width:0}
  .orbit{grid-template-columns:minmax(0,1fr)}
  .orb-stage,.orb-panel{min-width:0}
  .orb-stage{height:auto;padding:22px 16px 18px;overflow:visible}
  .orb-core{position:relative;inset:auto;transform:none;margin:10px auto 20px;width:260px;height:260px}
  .orb-hubs{position:static;transform:none;flex-direction:row;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
  .hub{flex:0 0 140px;scroll-snap-align:start}
  .hub:hover{transform:none}
  .orb-nodes{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px}
  .node{position:static!important;transform:none;max-width:none;padding:9px 10px;border-radius:12px;border:1px solid var(--line2);background:var(--surface)}
  .node.on{border-color:rgba(56,224,123,.5)}
  .orb-svg{display:none}
  .pulse{grid-template-columns:repeat(2,minmax(0,1fr))}
  .deck-below{grid-template-columns:1fr}
}
@media (max-width:760px){
  :root{--top:58px}
  .side{display:none}
  .main{margin:0}
  .top{padding-inline:14px;gap:6px}
  .top h1{font-size:18px}
  .search-btn{min-width:0;width:38px;padding:0;justify-content:center}
  .search-btn span,.search-btn kbd,.new-btn{display:none}
  .tgroup{padding:2px}
  .view{padding:4px 14px calc(100px + var(--safe-b))}
  .bnav{display:flex;position:fixed;bottom:10px;inset-inline:10px;z-index:40;background:linear-gradient(180deg,rgba(30,34,32,.82),rgba(18,21,20,.9));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:6px 6px calc(6px + var(--safe-b));box-shadow:0 18px 40px rgba(0,0,0,.5)}
  [data-theme="light"] .bnav{background:rgba(255,255,255,.88)}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 0;border-radius:14px;position:relative;font-weight:500}
  .bnav a svg.i{width:22px;height:22px}
  .bnav a.on{color:var(--accent);background:var(--accent-soft)}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .fab{bottom:calc(90px + var(--safe-b));inset-inline-end:16px;width:54px;height:54px}
  .hello h2{font-size:22px}
  .pgrid,.tgrid,.team-now{grid-template-columns:1fr}
  .col{flex-basis:84vw;max-height:none}
  .board{margin-inline:-14px;padding-inline:14px}
  .ov{padding:0;align-items:flex-end}
  .modal,.modal.wide,.modal.narrow{max-width:none;border-radius:22px 22px 0 0;max-height:92vh}
  .srch{padding-top:0}
  .form{grid-template-columns:1fr}
  .sb{grid-template-columns:110px 1fr 24px}
  .hide-m{display:none!important}
  .pd-head h2{font-size:24px}
  .toast-wrap{bottom:calc(100px + var(--safe-b))}
  .toolbar .inp-ic{flex:1 1 100%}
  .orb-core{width:230px;height:230px}
  .orb-label .big{font-size:38px}
  .orb-nodes{grid-template-columns:1fr}
  .pulse{gap:10px}.pl{padding:12px;gap:10px}.pl .ic{width:34px;height:34px}.pl .v{font-size:22px}
  .deck-wrap{height:420px}
  .fold{width:160px;height:214px;margin:-107px 0 0 -80px;top:60%}
  .fold .sheet{height:80px;top:14px;left:16px;right:16px;padding:9px;gap:5px}
  .fold .nm{font-size:14.5px}
  .fcard{width:180px;padding:12px 14px;top:60%;transform:translate(-50%,-150%)}
  .fcard .t{font-size:15px}.fcard .p{font-size:36px;margin-top:8px}.fcard .d{font-size:11.5px}
  .fcard::after{width:140px;height:110px}
  .fcard .pin{width:20px;height:20px;right:14px;bottom:16px}
  .kd-row{grid-template-columns:90px 1fr auto;padding:10px 14px}
  .gpanel{padding:50px 16px 16px}
  .gpanel .fan div{width:96px;height:66px}
}
@media (min-width:761px){.show-m{display:none!important}}


/* ================= v3 additions ================= */
button.side-foot{width:100%;text-align:start;border-radius:12px;color:inherit}
button.side-foot:hover{background:var(--surface2)}
.jsub{font-size:13px;font-weight:600;color:var(--ink2);margin:22px 0 10px;display:flex;align-items:center;gap:6px}
.jsub svg.i{width:15px;height:15px}
.rec{width:9px;height:9px;border-radius:50%;background:var(--late);box-shadow:0 0 0 0 rgba(255,106,92,.6);animation:recp 1.6s infinite;flex:none;display:inline-block}
@keyframes recp{0%{box-shadow:0 0 0 0 rgba(255,106,92,.55)}70%{box-shadow:0 0 0 8px rgba(255,106,92,0)}100%{box-shadow:0 0 0 0 rgba(255,106,92,0)}}
/* timer pill + attendance pill + bell */
.tpill{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:14px;background:linear-gradient(180deg,rgba(255,106,92,.14),rgba(255,106,92,.05));border:1px solid rgba(255,106,92,.35);max-width:420px;min-width:0;margin-inline-start:8px}
[dir="rtl"] .tpill{padding:0 12px 0 6px}
.tp-t{display:flex;flex-direction:column;min-width:0;text-align:start;line-height:1.2}
.tp-t b{font-size:12.5px;font-weight:500}.tp-t span{font-size:11px;color:var(--muted)}
.tp-c{font-size:15px;font-weight:300;letter-spacing:.02em;min-width:62px;text-align:center}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn.ok{color:var(--ok)}
.att-pill{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface2),var(--surface));font-size:13px;font-weight:500;white-space:nowrap}
.att-pill svg.i{width:16px;height:16px;color:var(--accent)}
.att-pill.on{border-color:rgba(56,224,123,.4);color:var(--accent)}
.bell{position:relative}
.bdot{position:absolute;top:3px;inset-inline-end:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--late);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.notif-panel{padding:0;overflow:hidden}
.np-h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.np-b{max-height:min(460px,70vh);overflow-y:auto;padding:4px}
.np-i{display:flex!important;gap:10px;align-items:flex-start!important;padding:10px!important;border-radius:10px;position:relative}
.np-i.unread{background:var(--accent-soft)}
.np-t{display:block;font-size:13px;line-height:1.4}
.np-d{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.np-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.np-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;color:var(--ink2)}
.np-ic svg.i{width:15px;height:15px}
.np-f{padding:10px 14px;border-top:1px solid var(--line)}
/* task timer button + live rows */
.tbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);background:var(--surface2);flex:none;transition:all .15s}
.tbtn svg.i{width:13px;height:13px;stroke-width:2.4}
.tbtn:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(56,224,123,.35)}
.tbtn.on{background:var(--late);border-color:var(--late);color:#fff;box-shadow:0 0 14px rgba(255,106,92,.45)}
.trow.live,.kc.live{background:linear-gradient(90deg,rgba(255,106,92,.08),transparent 60%)}
.kc.live{border-color:rgba(255,106,92,.4)}
.sess{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;padding:4px 0}
/* login */
.login-wrap{width:100%;min-width:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:420px;margin:0;padding:28px}
.join-done{text-align:center;padding:40px 28px}
.join-done>svg.i{width:46px;height:46px;color:var(--accent);margin-bottom:10px}
.join-done h2{font-weight:300;margin:6px 0}
/* join */
.join{width:100%;min-width:0;max-width:860px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1}
.join-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.join-brand b{display:block;font-weight:600}.join-brand span{font-size:12.5px;color:var(--muted)}
.join-card{overflow:hidden}
.jsteps{display:flex;gap:4px;padding:14px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.jsteps span{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:max-content}
.jsteps i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.jsteps span.a{color:var(--ink)}.jsteps span.a i{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 12px rgba(56,224,123,.45)}
.jsteps span.d i{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.join-b{padding:20px}
.join-b h3{margin:0 0 16px;font-weight:400;font-size:20px}
.photo-pick{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.photo-pick .ph{width:96px;height:96px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer;background:center/cover no-repeat var(--surface);flex:none;transition:border-color .15s}
.photo-pick .ph:hover{border-color:var(--accent)}
.photo-pick .ph.has{border-style:solid;border-color:var(--accent)}
.photo-pick .ph svg.i{width:34px;height:34px}
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.doc-up{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);background:var(--surface);cursor:pointer;text-align:start;width:100%;transition:border-color .15s}
.doc-up:hover{border-color:var(--accent)}
.doc-up.ok{border-style:solid;border-color:rgba(56,224,123,.35)}
.doc-up.busy{opacity:.5;pointer-events:none}
.doc-up .di{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.doc-up.ok .di{background:var(--accent-soft);color:var(--accent)}
.doc-up b{font-weight:500;font-size:13.5px}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.55;cursor:pointer}
.consent input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
/* profile */
.ph-head{display:flex;align-items:center;gap:18px}
.ph-av{width:84px;height:84px;border-radius:50%;background:center/cover no-repeat;display:grid;place-items:center;font-size:30px;font-weight:300;color:#fff;flex:none;border:3px solid var(--line);box-shadow:0 0 0 4px var(--surface)}
.ph-head h2{margin:2px 0 2px;font-size:26px;font-weight:300;letter-spacing:-.01em}
.pf-kv{grid-template-columns:200px 1fr;gap:8px 18px}
.pf-kv dd{text-align:start;font-weight:400}
.ap-box{margin-top:20px;padding:16px;border-radius:16px;border:1px solid rgba(56,224,123,.3);background:var(--accent-soft)}
/* HR */
.hr-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.hr-type{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:start;transition:border-color .15s,transform .15s}
.hr-type:hover{border-color:var(--accent);transform:translateY(-2px)}
.hr-type .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.hr-type b{font-weight:500}.hr-type span{font-size:12px;color:var(--muted)}
.hr-row{flex-wrap:wrap}
/* attendance */
.punch{display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:center;padding:22px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.punch::before{content:"";position:absolute;width:360px;height:360px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(56,224,123,.14),transparent 65%);pointer-events:none}
.pc-clock span{font-size:52px;font-weight:200;line-height:1;letter-spacing:-.03em}
.pc-clock small{display:block;color:var(--muted);margin-top:6px}
.pc-st{display:flex;gap:18px;flex-wrap:wrap;grid-column:1;font-size:13px;color:var(--ink2)}
.pc-st b{font-weight:500;color:var(--ink)}
.punch-btn{grid-column:2;grid-row:1/3;width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent-ink);background:radial-gradient(circle at 30% 25%,#7DF5AD,var(--accent) 55%,var(--accent2));box-shadow:0 0 0 8px rgba(56,224,123,.12),0 0 40px rgba(56,224,123,.4);position:relative;transition:transform .15s}
.punch-btn:active{transform:scale(.96)}
.punch-btn svg.i{width:30px;height:30px;stroke-width:2}
.punch-btn b{font-weight:600;font-size:14px}
.punch-btn.out{background:radial-gradient(circle at 30% 25%,#FFB2A8,var(--late) 55%,#B5221A);color:#fff;box-shadow:0 0 0 8px rgba(255,106,92,.12),0 0 40px rgba(255,106,92,.35)}
.punch-btn.busy{opacity:.6;pointer-events:none}
.punch-btn .ring-p{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,255,255,.25);animation:ringp 2.4s ease-out infinite}
@keyframes ringp{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.punch>.chip{grid-column:2;grid-row:1/3}
.pc-note{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin:4px 0 0}
.pc-note svg.i{width:14px;height:14px}
.att-pane{padding:14px 0;border-bottom:1px solid var(--line2)}
.att-pane:last-of-type{border-bottom:0}
.att-grid{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;margin:12px 0}
.radar{width:100%;max-width:240px;display:block}
.lmap{border-radius:14px;overflow:hidden;margin:8px 0 10px;border:1px solid var(--line)}
.office-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.office-row .inp:first-child{flex:1 1 200px}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.rule{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--surface)}
.rule span{flex:1;min-width:0}.rule .sel{height:32px;font-size:12.5px}
/* wizard + scope */
.wz-steps{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.wz-steps span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;padding-inline-end:12px}
.wz-steps i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.wz-steps .a{color:var(--ink)}.wz-steps .a i{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.wz-steps .d i{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.svc-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;font-size:12.5px;transition:all .15s}
.svc svg.i{width:22px;height:22px;color:var(--muted)}
.svc b{font-weight:500;line-height:1.3}
.svc.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow)}
.svc.on svg.i{color:var(--accent)}
.scope-top{position:sticky;top:-18px;z-index:2;background:var(--solid);padding:4px 0 12px;margin-top:-4px}
.scope-sum{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink2);font-size:13px}
.scope-sum b{color:var(--accent);font-weight:600;font-size:15px}
.scope{display:flex;flex-direction:column;gap:12px}
.sc-g{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.sc-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line2)}
.sc-h b{font-weight:500}
.sc-tog,.sc-i .cb{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--muted);display:grid;place-items:center;color:transparent;flex:none}
.sc-tog svg.i,.sc-i .cb svg.i{width:13px;height:13px;stroke-width:3}
.sc-tog.all,.sc-i.on .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sc-tog.some{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sc-items{display:grid;grid-template-columns:1fr 1fr}
.sc-i{display:flex;align-items:center;gap:10px;padding:9px 14px;text-align:start;font-size:13px;border-bottom:1px solid var(--line2);color:var(--muted);transition:background .12s}
.sc-i:hover{background:var(--surface2)}
.sc-i.on{color:var(--ink)}
.sc-i.lock{cursor:not-allowed}
.sc-i .opt{font-size:10.5px;color:var(--gold);border:1px solid rgba(216,184,120,.35);border-radius:6px;padding:0 5px;margin-inline-start:4px}
.tm-tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
/* performance */
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.cmp{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cmp-bars{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.cb-row{display:flex;align-items:center;gap:8px}
/* chat */
.view-chat{padding-bottom:20px}
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:calc(100vh - var(--top) - 40px);min-height:480px}
.ch-list{overflow-y:auto;padding:8px}
.ch-sec{font-size:11.5px;color:var(--muted);font-weight:500;padding:12px 10px 6px;letter-spacing:.04em;text-transform:uppercase}
[lang="ar"] .ch-sec{text-transform:none;letter-spacing:0}
.ch-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;text-align:start}
.ch-i:hover{background:var(--surface2)}
.ch-i.on{background:var(--accent-soft)}
.ch-i b{display:block;font-weight:500;font-size:13.5px}
.ch-i .grow>span{display:block;font-size:12px;color:var(--muted)}
.ch-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;color:var(--ink2)}
.ch-ic.big{width:38px;height:38px}
.ch-main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ch-head b{font-weight:500}
.ch-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.day-sep{text-align:center;margin:14px 0 8px}
.day-sep span{font-size:11.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:78%;margin-top:8px;position:relative}
.msg.grp{margin-top:2px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av-sp{width:32px;flex:none}
.msg.me .av-sp{display:none}
.mb{display:flex;flex-direction:column;min-width:0;position:relative}
.msg.me .mb{align-items:flex-end}
.mn{font-size:11.5px;color:var(--muted);margin:0 4px 3px}
.bub{padding:9px 13px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);font-size:14px;line-height:1.5;word-wrap:break-word;white-space:normal;max-width:100%}
.msg:not(.me) .bub{border-end-start-radius:6px}
.msg.me .bub{background:linear-gradient(160deg,#5BF09A,var(--accent) 50%,var(--accent2));color:var(--accent-ink);border-color:transparent;border-end-end-radius:6px}
[data-theme="light"] .msg.me .bub{color:#fff}
.bub a{color:inherit;text-decoration:underline}
.bub.big{font-size:40px;line-height:1.1;background:none!important;border:0;padding:2px}
.stk{width:120px;height:120px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));animation:pop .25s ease}
.stk svg{width:100%;height:100%}
.mt{font-size:10.5px;color:var(--muted);margin:3px 6px 0;opacity:0;transition:opacity .15s}
.msg:hover .mt{opacity:1}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rx button{height:24px;padding:0 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px}
.rx button.on{border-color:var(--accent);background:var(--accent-soft)}
.qr{position:absolute;top:-34px;inset-inline-end:0;display:none;gap:2px;padding:4px;border-radius:99px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:3}
.msg:not(.me) .qr{inset-inline-end:auto;inset-inline-start:0}
.msg:hover .qr{display:flex}
.qr button{width:30px;height:30px;border-radius:50%;font-size:17px;transition:transform .12s}
.qr button:hover{transform:scale(1.25);background:var(--surface2)}
.composer{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.composer .icon-btn{font-size:20px}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;outline:none;max-height:140px;min-height:42px;line-height:1.45}
.composer textarea:focus{border-color:var(--accent)}
.composer .send{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#7DF5AD,var(--accent) 55%,var(--accent2));color:var(--accent-ink);flex:none}
.picker{padding:8px}
.pk-tabs{display:flex;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pk-tabs button{width:38px;height:34px;border-radius:9px;font-size:18px;display:grid!important;place-items:center;padding:0!important}
.pk-tabs button.on{background:var(--surface2)}
.pk-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:240px;overflow-y:auto}
.pk-grid button{height:36px;font-size:21px;border-radius:9px;display:grid!important;place-items:center;padding:0!important;width:auto!important}
.pk-grid button:hover{background:var(--surface2);transform:scale(1.15)}
.stk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:340px;overflow-y:auto}
.stk-grid button{padding:4px!important;border-radius:12px;display:block!important;width:auto!important}
.stk-grid button:hover{background:var(--surface2)}
.stk-grid svg{width:100%;height:auto;display:block}
@media (max-width:1180px){.chat{grid-template-columns:260px minmax(0,1fr)}.svc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tpill .tp-t{display:none}}
@media (max-width:760px){
 .tpill{position:fixed;left:12px;right:12px;top:calc(var(--top) + var(--safe-t) + 4px);z-index:39;margin:0;max-width:none;background:linear-gradient(180deg,rgba(60,20,18,.92),rgba(30,12,10,.92));backdrop-filter:blur(14px)}
 [data-theme="light"] .tpill{background:rgba(255,240,238,.95)}
 .tpill .tp-t{display:flex;flex:1}
 .chat{display:block;height:calc(100vh - var(--top) - 110px - var(--safe-b))}
 .ch-list,.ch-main{height:100%}
 .chat .ch-main{display:none}.chat.open .ch-list{display:none}.chat.open .ch-main{display:flex}
 .msg{max-width:88%}
 .pf-kv{grid-template-columns:1fr}.pf-kv dt{margin-top:6px}
 .punch{grid-template-columns:1fr;text-align:center;justify-items:center}
 .punch-btn,.punch>.chip{grid-column:1;grid-row:auto}
 .pc-st{justify-content:center}.pc-note{justify-content:center}
 .att-grid{grid-template-columns:1fr}
 .sc-items{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ph-head h2{font-size:21px}.ph-av{width:64px;height:64px;font-size:24px}
 .scope-top{top:-18px}
 .stk{width:100px;height:100px}
 .pk-grid{grid-template-columns:repeat(7,1fr)}
}



/* ================= v4 additions ================= */
/* seniority themes */
[data-level="l1"]{--accent:#38E07B;--accent2:#14A650}
[data-level="l2"]{--accent:#3FD6C6;--accent2:#169C8F;--accent-soft:rgba(63,214,198,.11);--glow:0 0 0 1px rgba(63,214,198,.55),0 0 28px rgba(63,214,198,.33)}
[data-level="l3"]{--accent:#E2C27E;--accent2:#A9822F;--accent-soft:rgba(226,194,126,.12);--glow:0 0 0 1px rgba(226,194,126,.55),0 0 28px rgba(226,194,126,.3)}
[data-level="l4"]{--accent:#B9A6FF;--accent2:#7B62E0;--accent-soft:rgba(185,166,255,.12);--glow:0 0 0 1px rgba(185,166,255,.55),0 0 28px rgba(185,166,255,.3)}
[data-level="l5"]{--accent:#EDE6D3;--accent2:#B8AD8E;--accent-soft:rgba(237,230,211,.1);--accent-ink:#141210;--glow:0 0 0 1px rgba(237,230,211,.5),0 0 30px rgba(237,230,211,.25)}
[data-theme="light"][data-level]{--accent:#12A150;--accent2:#0B7A3B;--accent-ink:#fff;--accent-soft:rgba(18,161,80,.1)}
[data-theme="light"][data-level="l3"]{--accent:#A67C35;--accent2:#7D5A1F;--accent-soft:rgba(166,124,53,.1)}
[data-theme="light"][data-level="l4"]{--accent:#6A4FD6;--accent2:#4B35A8;--accent-soft:rgba(106,79,214,.1)}
[data-theme="light"][data-level="l5"]{--accent:#2A2620;--accent2:#000;--accent-soft:rgba(42,38,32,.08)}
/* surprise / event modes */
[data-event="ramadan"]{--accent:#E8C26A;--accent2:#9C7420;--accent-soft:rgba(232,194,106,.12)}
[data-event="ramadan"] body{background:radial-gradient(1000px 600px at 80% -10%,rgba(120,80,200,.18),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(232,194,106,.08),transparent 60%),var(--bg)}
[data-event="eid"]{--accent:#F2D27A;--accent2:#B98A2A;--accent-soft:rgba(242,210,122,.12)}
[data-event="newyear"]{--accent:#F5E3B5;--accent2:#C9A85A;--accent-soft:rgba(245,227,181,.12)}
[data-event="celebrate"] body{background:radial-gradient(900px 500px at 85% -10%,rgba(255,106,92,.12),transparent 60%),radial-gradient(900px 500px at 10% 0%,rgba(141,177,255,.12),transparent 60%),radial-gradient(900px 500px at 50% 110%,rgba(56,224,123,.1),transparent 60%),var(--bg)}
[data-event="anniversary"]{--accent:#D8B878;--accent2:#8E6E2E;--accent-soft:rgba(216,184,120,.12)}
.ev-banner{display:flex;align-items:center;gap:14px;padding:12px 18px;margin-bottom:14px;border-radius:16px;background:linear-gradient(110deg,var(--accent-soft),rgba(216,184,120,.12));border:1px solid var(--accent);box-shadow:var(--glow)}
.ev-banner .ev-e{font-size:28px}.ev-banner b{display:block;font-weight:500;font-size:15px}.ev-banner span{font-size:12.5px;color:var(--ink2)}
.plinthy-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);font-size:11.5px;font-weight:500;letter-spacing:.02em;margin-inline-end:8px;background:var(--accent-soft)}
.plinthy{font-size:12.5px;color:var(--accent);font-weight:500;letter-spacing:.02em}
/* buzz */
.buzz-wall{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x mandatory}
.buzz-wall.empty-bw{padding-bottom:10px}
.buzz{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface2),var(--surface));max-width:340px;text-align:start;scroll-snap-align:start;transition:transform .15s,border-color .15s}
[dir="rtl"] .buzz{padding:8px 8px 8px 14px}
.buzz:hover{transform:translateY(-2px);border-color:var(--accent)}
.buzz .bz-e{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--surface2);flex:none}
.buzz .bz-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}.buzz .bz-t b{font-weight:500;font-size:13px}.buzz .bz-t span{font-size:11.5px;color:var(--muted)}
.buzz .bz-c{font-size:12px;color:var(--ink2);flex:none}
.buzz.gold{border-color:rgba(232,196,110,.7);background:linear-gradient(110deg,rgba(232,196,110,.25),rgba(232,196,110,.06));box-shadow:0 0 22px rgba(232,196,110,.25)}
.buzz.gold .bz-e{background:linear-gradient(140deg,#FFF1C1,#D8B878);}
.buzz.bd{border-color:rgba(255,140,170,.5);background:linear-gradient(110deg,rgba(255,140,170,.18),rgba(255,140,170,.04))}
.buzz-add{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;border-radius:99px;border:1px dashed var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
.buzz-add:hover{border-color:var(--accent);color:var(--accent)}
.seg-l{height:32px;padding:0 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;cursor:pointer}
.seg-l.on{background:var(--surface2);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.gold-c{border-color:rgba(232,196,110,.5);background:rgba(232,196,110,.08)}
.bz-modal{background:transparent!important;border:0!important;box-shadow:none!important}
.bz-card{position:relative;background:var(--solid);border:1px solid var(--line);border-radius:26px;padding:30px 26px 24px;text-align:center;box-shadow:var(--shadow-lg);overflow:hidden}
.bz-card.gold{background:radial-gradient(500px 300px at 50% 0%,rgba(232,196,110,.35),transparent 70%),var(--solid);border-color:rgba(232,196,110,.6)}
.bz-card h2{font-weight:300;font-size:24px;margin:10px 0 8px;line-height:1.25}.bz-card p{color:var(--ink2)}
.bz-card .avs{justify-content:center}
.bz-big{font-size:46px;line-height:1;margin-bottom:12px}
.bz-x{position:absolute;top:12px;inset-inline-end:12px}
.bz-cheers{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
.bz-cheers button{height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:17px;transition:transform .12s}
.bz-cheers button:hover{transform:scale(1.08)}.bz-cheers button.on{border-color:var(--accent);background:var(--accent-soft)}
.bz-cheers span{font-size:12.5px}
.gb-wishes{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:start;max-height:240px;overflow:auto}
.gb-wishes>div{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--surface);font-size:13px}
/* golden takeover */
.gb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 600px at 50% 30%,rgba(232,196,110,.35),rgba(6,8,7,.94) 70%);backdrop-filter:blur(8px);animation:fade .4s ease}
[data-theme="light"] .gb{background:radial-gradient(800px 600px at 50% 30%,rgba(232,196,110,.5),rgba(240,236,226,.96) 70%)}
.gb .confetti,.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:101}
.gb-in{position:relative;z-index:102;max-width:560px;text-align:center;animation:pop .5s cubic-bezier(.2,.8,.2,1.2)}
.gb-e{font-size:72px;line-height:1;filter:drop-shadow(0 10px 30px rgba(232,196,110,.6));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.gb .eyebrow{color:#E8C46E;letter-spacing:.3em;margin:16px 0 10px;font-weight:600}
.gb h1{font-size:40px;font-weight:200;letter-spacing:-.02em;line-height:1.15;margin:12px 0 8px;background:linear-gradient(180deg,#FFF6DA,#D8B878);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="light"] .gb h1{background:linear-gradient(180deg,#6b4f17,#A67C35);-webkit-background-clip:text;background-clip:text}
.gb p{color:var(--ink2);font-size:15px}
.gb-who{color:#E8C46E;font-weight:500}
.gb-avs{justify-content:center;margin:18px 0 6px}.gb-avs .av{box-shadow:0 0 0 3px #E8C46E,0 0 30px rgba(232,196,110,.6);border:0}
.gb-btn{margin-top:22px;height:46px;padding:0 26px;border-radius:99px;background:linear-gradient(180deg,#FFF1C1,#D8B878);color:#2A1E05;border:0;font-weight:600}
/* memos */
.memo-list{display:flex;flex-direction:column;gap:12px}
.memo{padding:16px 18px}.memo h3{margin:0;font-weight:500;font-size:16px}
.memo.imp{border-color:rgba(244,182,74,.45)}.memo.imp .np-ic{color:var(--risk)}
.memo-b{margin:12px 0;color:var(--ink2);line-height:1.7}
/* downtime + nudge + budget */
.down-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:14px;border-radius:14px;background:var(--risk-soft);border:1px solid rgba(244,182,74,.5)}
.down-bar b{font-weight:500;display:block}.down-bar span{font-size:12.5px;color:var(--ink2)}
.nudge{position:fixed;z-index:70;bottom:calc(24px + var(--safe-b));inset-inline-start:calc(var(--side) + 24px);width:min(380px,calc(100vw - 32px));padding:16px;display:flex;gap:12px;align-items:flex-start;background:var(--solid);box-shadow:var(--shadow-lg);border-color:var(--accent);animation:pop .3s ease}
.nudge .ng-ic{font-size:24px}.nudge b{display:block;font-weight:500}.nudge span{font-size:12.5px;color:var(--muted)}
.ng-x{position:absolute;top:8px;inset-inline-end:8px}
.ng-list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.ng-list button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:start;font-size:13px}
.ng-list button:hover{border-color:var(--accent)}.ng-list svg.i{width:13px;height:13px;color:var(--accent)}
.bud{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);width:100%}
.bud .bar{flex:1;height:4px}.bud .bar>i{box-shadow:none}
.bud.warn{color:var(--risk)}.bud.warn .bar>i{background:var(--risk)}
.bud.over{color:var(--late);font-weight:600}.bud.over .bar>i{background:var(--late)}
.trow .bud{width:auto;min-width:150px;max-width:190px}
.tp-l{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.tp-l.warn{color:var(--risk)}.tp-l.over{color:#fff;background:var(--late)}
/* proof + reviews */
.proof{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin:12px 0}
.proof .row{flex-wrap:wrap}
.rv-card{padding:14px 16px;margin-bottom:12px}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.kpic{padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.medal{position:absolute;top:10px;inset-inline-end:12px;font-size:24px}
.sring{position:relative;flex:none}.sring svg{width:100%;height:100%;transform:rotate(-90deg)}.sring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:300}
.kc-bars{display:flex;flex-direction:column;gap:6px}
.kb{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.kb b{text-align:end;color:var(--ink);font-weight:500}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.stars label{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:var(--muted)}
.stars span{font-size:30px;color:var(--line);transition:color .12s,transform .12s}
.stars label:has(input:checked) span,.stars label:has(~ label input:checked) span{color:#F4C14A}
[dir="rtl"] .stars{flex-direction:row}
.stars label:hover span{transform:scale(1.15)}
.stars em{font-style:normal}
/* payroll & letters */
.slip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.lh{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lh-mark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}
.lh b{display:block;font-size:17px;font-weight:600}.lh span{font-size:12px;color:var(--muted)}
.lh-c{font-size:11px;color:var(--muted);text-align:end;line-height:1.5}
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.sl-row b{font-weight:500}
